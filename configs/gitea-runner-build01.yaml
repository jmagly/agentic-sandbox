log:
  level: info

runner:
  file: /build/gitea-runner/data/.runner
  capacity: 1
  timeout: 6h
  shutdown_timeout: 5m
  insecure: false
  fetch_timeout: 5s
  fetch_interval: 2s
  labels:
    - "ubuntu-latest:docker://catthehacker/ubuntu:act-24.04"
    - "ubuntu-24.04:docker://catthehacker/ubuntu:act-24.04"
    - "ubuntu-22.04:docker://catthehacker/ubuntu:act-22.04"
    - "s9-build:host"
    - "rust:docker://rust:latest"
    - "node:docker://node:22"
    - "go:docker://golang:latest"
    - "native:host"

cache:
  enabled: true
  dir: /build/gitea-runner/data/cache

container:
  network: ""
  privileged: false
  workdir_parent: /build/gitea-runner/data/workdir
  docker_host: ""
  force_pull: false
