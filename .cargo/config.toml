[build]
# This workstation exposes 20 logical CPUs. Leave half available for the OS,
# VM/container substrates, and interactive work during local Cargo builds.
# CI lanes may override this with CARGO_BUILD_JOBS when their runner budget is
# measured separately.
jobs = 10

[env]
# Cargo's build.jobs setting does not limit libtest execution threads. Apply
# the same half-host default to direct `cargo test` entry points; an explicit
# environment value still wins because this setting is not forced.
RUST_TEST_THREADS = { value = "10", force = false }
