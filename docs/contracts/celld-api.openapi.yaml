openapi: 3.1.0
info:
  title: Agentic Sandbox Celld Adapter API
  version: 1.0.0
  description: Optional Celld adapter surface. Operator routes use management authentication; the internal effect callback uses generation-bound HMAC authentication. Celld is disabled by default.
servers:
  - url: /api/v2/celld
security:
  - bearerAuth: []
paths:
  /status:
    get:
      operationId: celldStatus
      responses:
        '200':
          description: Pinning, availability, compatibility, and security posture. Secret values are never returned.
          content:
            application/json:
              schema: { type: object }
  /cells/{instance_id}:
    get:
      operationId: getInstanceCell
      parameters:
        - $ref: '#/components/parameters/InstanceId'
        - name: generation
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Durable InstanceCell state
          content:
            application/json:
              schema: { $ref: './celld/instance-cell-v1.schema.json#/$defs/state' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cells/{instance_id}/commands:
    post:
      operationId: commandInstanceCell
      parameters: [ { $ref: '#/components/parameters/InstanceId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './celld/instance-cell-v1.schema.json#/$defs/command' }
      responses:
        '200': { description: Idempotent replay }
        '202': { description: Command durably accepted before effect }
        '409': { description: Operation collision or generation fence }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cells/{instance_id}/reconcile:
    post:
      operationId: reconcileInstanceCell
      parameters: [ { $ref: '#/components/parameters/InstanceId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [management_generation]
              properties:
                management_generation: { type: integer, minimum: 1 }
      responses:
        '200': { description: Divergence classification and generation-safe repair plan }
        '503': { $ref: '#/components/responses/Unavailable' }
  /effects:
    post:
      operationId: dispatchInstanceCellEffect
      description: Internal InstanceCell callback. The signed operation ID and generation, Idempotency-Key, request body, and canonical request hash must agree. Management durably claims the effect before provider dispatch.
      security:
        - celldCallbackKey: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { $ref: '#/components/schemas/OperationId' }
        - name: X-Agentic-Key-Id
          in: header
          required: true
          schema: { type: string, minLength: 1 }
        - name: X-Agentic-Timestamp
          in: header
          required: true
          schema: { type: string, format: date-time }
        - name: X-Agentic-Nonce
          in: header
          required: true
          schema: { type: string, minLength: 1 }
        - name: X-Agentic-Generation
          in: header
          required: true
          schema: { type: integer, minimum: 1 }
        - name: X-Agentic-Operation-Id
          in: header
          required: true
          schema: { $ref: '#/components/schemas/OperationId' }
        - name: X-Agentic-Body-Sha256
          in: header
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
        - name: X-Agentic-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [instance_id, generation, effect]
              properties:
                instance_id: { type: string, minLength: 1, maxLength: 128 }
                generation: { type: integer, minimum: 1 }
                effect: { $ref: './celld/instance-cell-v1.schema.json#/$defs/effect' }
      responses:
        '200': { description: Stable terminal effect result or terminal replay, including the durable provider_dispatch_count }
        '202': { description: Original management operation remains dispatched or outcome-unknown; no replacement effect was created; includes the durable provider_dispatch_count }
        '401': { description: "Missing, stale, or invalid callback authentication" }
        '409': { description: "Nonce replay, operation collision, identity mismatch, or generation fence. Pre-ledger generation fences include provider_dispatch_count_delta=0." }
        '503': { $ref: '#/components/responses/Unavailable' }
  /bundles/validate:
    post:
      operationId: validateCelldBundle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './celld/worker-bundle-v1.schema.json' }
      responses:
        '200': { description: Bundle is within the constrained capability envelope }
        '422': { description: Bundle is unsafe or incompatible }
  /fleets/validate:
    post:
      operationId: validateCelldFleet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './celld/fleet-manifest-v1.schema.json' }
      responses:
        '200': { description: Fleet contract is valid }
        '422': { description: Fleet contract is unsafe or incompatible }
  /fleets/preflight:
    post:
      operationId: evaluateCelldObjectStorePreflight
      deprecated: true
      description: Legacy summary input. Caller-supplied booleans cannot qualify a store; this endpoint always rejects and operators must use the versioned raw-evidence qualifier.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BucketPreflightEvidence' }
      responses:
        '422': { description: Summary evidence is non-authoritative and cannot qualify storage }
  /fleets/diagnose:
    post:
      operationId: diagnoseCelldFleet
      description: Classify captured fleet observations without mutating the fleet. Fixture and local sources never claim live qualification.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FleetDiagnoseRequest' }
      responses:
        '200':
          description: Read-only diagnostic classification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetDiagnoseReport' }
        '422': { description: Observation contract or fleet manifest is invalid }
  /fleets/plan-upgrade:
    post:
      operationId: planCelldFleetUpgrade
      description: Produces an advisory, non-mutating plan. Execution remains outside this API and requires the separately authorized live rollout controller and reviewed substrate adapter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [manifest, from, to]
              properties:
                manifest: { $ref: './celld/fleet-manifest-v1.schema.json' }
                from: { type: string, minLength: 1 }
                to: { type: string, minLength: 1 }
      responses:
        '200':
          description: Advisory reserve arithmetic; mutating is always false and execution_controller is null
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [qualified, plan]
                properties:
                  qualified: { const: true }
                  plan: { $ref: '#/components/schemas/UpgradePlan' }
        '422': { description: Version pair or fleet is unqualified; no node should be drained }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    celldCallbackKey:
      type: apiKey
      in: header
      name: X-Agentic-Signature
      description: HMAC-SHA-256 plus the required freshness, nonce, digest, operation, and generation headers.
  schemas:
    OperationId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    BucketPreflightEvidence:
      type: object
      additionalProperties: false
      required: [conditional_create, conditional_overwrite, read_after_write, cleanup_verified, latency_ms_p99]
      properties:
        conditional_create: { type: boolean }
        conditional_overwrite: { type: boolean }
        read_after_write: { type: boolean }
        cleanup_verified: { type: boolean }
        latency_ms_p99: { type: integer, minimum: 0 }
    FleetDiagnoseRequest:
      type: object
      additionalProperties: false
      required: [schema_version, source, observed_at, manifest, backend, artifact, listeners, nodes, membership, store]
      properties:
        schema_version: { const: agentic-sandbox.celld-fleet-diagnose/v1 }
        source: { type: string, enum: [fixture, local] }
        observed_at: { type: string, format: date-time }
        manifest: { $ref: './celld/fleet-manifest-v1.schema.json' }
        backend:
          type: object
          additionalProperties: false
          required: [substrate, reachable]
          properties:
            substrate: { type: string }
            reachable: { type: boolean }
        artifact:
          type: object
          additionalProperties: false
          required: [celld_version, celld_artifact_sha256, worker_digest]
          properties:
            celld_version: { type: string }
            celld_artifact_sha256: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
            worker_digest: { type: [string, 'null'], pattern: '^sha256:[a-f0-9]{64}$' }
        listeners:
          type: object
          additionalProperties: false
          required: [public_listener, internal_listener, advertised_addresses]
          properties:
            public_listener: { type: string }
            internal_listener: { type: string }
            advertised_addresses: { type: array, items: { type: string }, uniqueItems: true }
        nodes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [node_id, advertised_address, ready]
            properties:
              node_id: { type: string }
              advertised_address: { type: string }
              ready: { type: boolean }
        membership:
          type: object
          additionalProperties: false
          required: [stable, members]
          properties:
            stable: { type: boolean }
            members: { type: array, items: { type: string }, uniqueItems: true }
        store:
          type: object
          additionalProperties: false
          required: [provider, bucket, prefix, endpoint, reachable, startup_probe_passed]
          properties:
            provider: { type: string }
            bucket: { type: string }
            prefix: { type: string }
            endpoint: { type: [string, 'null'] }
            reachable: { type: boolean }
            startup_probe_passed: { type: boolean }
    FleetDiagnoseReport:
      type: object
      additionalProperties: false
      required: [schema_version, fleet_id, source, observed_at, status, reason_code, mutating, live_qualification, checks, observations]
      properties:
        schema_version: { const: agentic-sandbox.celld-fleet-diagnose-report/v1 }
        fleet_id: { type: string }
        source: { type: string, enum: [fixture, local] }
        observed_at: { type: string, format: date-time }
        status: { type: string, enum: [PASS, FAIL, NOT_RUN] }
        reason_code: { type: string }
        mutating: { const: false }
        live_qualification: { const: false }
        checks: { type: array, items: { type: object } }
        observations: { type: object }
    UpgradePlan:
      type: object
      additionalProperties: false
      required: [schema_version, mutating, execution_controller, from, to, node_count, batch_size, batches, minimum_available]
      properties:
        schema_version: { const: agentic-sandbox.celld-upgrade-plan/v1 }
        mutating: { const: false }
        execution_controller: { type: 'null' }
        from: { type: string }
        to: { type: string }
        node_count: { type: integer, minimum: 2 }
        batch_size: { type: integer, minimum: 1 }
        batches: { type: integer, minimum: 1 }
        minimum_available: { type: integer, minimum: 1 }
  parameters:
    InstanceId:
      name: instance_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    Unavailable:
      description: Celld is disabled, invalidly configured, or unavailable
