openapi: 3.1.0
info:
  title: Agentic Sandbox Celld Adapter API
  version: 1.0.0
  description: Optional Celld adapter surface. Operator routes use management authentication; the internal effect callback uses generation-bound HMAC authentication. Celld is disabled by default.
servers:
  - url: /api/v2/celld
security:
  - bearerAuth: []
paths:
  /status:
    get:
      operationId: celldStatus
      responses:
        '200':
          description: Pinning, availability, compatibility, and security posture. Secret values are never returned.
          content:
            application/json:
              schema: { type: object }
  /cells/{instance_id}:
    get:
      operationId: getInstanceCell
      parameters:
        - $ref: '#/components/parameters/InstanceId'
        - name: generation
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Durable InstanceCell state
          content:
            application/json:
              schema: { $ref: './celld/instance-cell-v1.schema.json#/$defs/state' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cells/{instance_id}/commands:
    post:
      operationId: commandInstanceCell
      parameters: [ { $ref: '#/components/parameters/InstanceId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './celld/instance-cell-v1.schema.json#/$defs/command' }
      responses:
        '200': { description: Idempotent replay }
        '202': { description: Command durably accepted before effect }
        '409': { description: Operation collision or generation fence }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cells/{instance_id}/reconcile:
    post:
      operationId: reconcileInstanceCell
      parameters: [ { $ref: '#/components/parameters/InstanceId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [management_generation]
              properties:
                management_generation: { type: integer, minimum: 1 }
      responses:
        '200': { description: Divergence classification and generation-safe repair plan }
        '503': { $ref: '#/components/responses/Unavailable' }
  /effects:
    post:
      operationId: dispatchInstanceCellEffect
      description: Internal InstanceCell callback. The signed operation ID and generation, Idempotency-Key, request body, and canonical request hash must agree. Management durably claims the effect before provider dispatch.
      security:
        - celldCallbackKey: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { $ref: '#/components/schemas/OperationId' }
        - name: X-Agentic-Key-Id
          in: header
          required: true
          schema: { type: string, minLength: 1 }
        - name: X-Agentic-Timestamp
          in: header
          required: true
          schema: { type: string, format: date-time }
        - name: X-Agentic-Nonce
          in: header
          required: true
          schema: { type: string, minLength: 1 }
        - name: X-Agentic-Generation
          in: header
          required: true
          schema: { type: integer, minimum: 1 }
        - name: X-Agentic-Operation-Id
          in: header
          required: true
          schema: { $ref: '#/components/schemas/OperationId' }
        - name: X-Agentic-Body-Sha256
          in: header
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
        - name: X-Agentic-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [instance_id, generation, effect]
              properties:
                instance_id: { type: string, minLength: 1, maxLength: 128 }
                generation: { type: integer, minimum: 1 }
                effect: { $ref: './celld/instance-cell-v1.schema.json#/$defs/effect' }
      responses:
        '200': { description: Stable terminal effect result or terminal replay }
        '202': { description: Original management operation remains dispatched or outcome-unknown; no replacement effect was created }
        '401': { description: Missing, stale, or invalid callback authentication }
        '409': { description: Nonce replay, operation collision, identity mismatch, or generation fence }
        '503': { $ref: '#/components/responses/Unavailable' }
  /bundles/validate:
    post:
      operationId: validateCelldBundle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './celld/worker-bundle-v1.schema.json' }
      responses:
        '200': { description: Bundle is within the constrained capability envelope }
        '422': { description: Bundle is unsafe or incompatible }
  /fleets/validate:
    post:
      operationId: validateCelldFleet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './celld/fleet-manifest-v1.schema.json' }
      responses:
        '200': { description: Fleet contract is valid }
        '422': { description: Fleet contract is unsafe or incompatible }
  /fleets/preflight:
    post:
      operationId: evaluateCelldObjectStorePreflight
      responses:
        '200': { description: Captured object-store semantics meet the qualification threshold }
        '422': { description: Evidence fails the threshold }
  /fleets/plan-upgrade:
    post:
      operationId: planCelldFleetUpgrade
      responses:
        '200': { description: Reserve-safe qualified rolling plan }
        '422': { description: Version pair or fleet is unqualified; no node should be drained }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    celldCallbackKey:
      type: apiKey
      in: header
      name: X-Agentic-Signature
      description: HMAC-SHA-256 plus the required freshness, nonce, digest, operation, and generation headers.
  schemas:
    OperationId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
  parameters:
    InstanceId:
      name: instance_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    Unavailable:
      description: Celld is disabled, invalidly configured, or unavailable
