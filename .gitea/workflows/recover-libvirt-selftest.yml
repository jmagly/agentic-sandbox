name: Recover Stale Libvirt Self-Test

on:
  workflow_dispatch:

jobs:
  recover-titan:
    name: Recover fixed-name libvirt checkpoint self-test on Titan
    runs-on: titan
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Reap only the disposable checkpoint self-test
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 5m \
            scripts/recover-libvirt-selftest.sh --apply

      - name: Schedule runner restart after recovery
        run: |
          set -euo pipefail
          sudo -n systemctl is-enabled gitea-runner-host.service
          sudo -n systemd-run \
            --unit="gitea-runner-host-recovery-${GITHUB_RUN_ID}" \
            --on-active=20s \
            /bin/systemctl restart gitea-runner-host.service
          echo "Titan runner restart scheduled in 20 seconds"
