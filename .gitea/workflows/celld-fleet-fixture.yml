name: Celld Fleet Fixture on Titan

on:
  workflow_dispatch:
    inputs:
      celld_channel:
        description: Exact immutable Celld image channel to exercise
        required: true
        default: approved
        type: choice
        options:
          - approved
          - reviewed-candidate

concurrency:
  # Reserve Titan against every other Celld qualification campaign. The
  # job-level group below also keeps this Docker-heavy fixture from
  # overlapping the repository's VM E2E workload on the shared host.
  group: agentic-sandbox-celld-qualification-titan
  cancel-in-progress: false

jobs:
  fleet-fixture:
    name: Pinned three-node fixture lifecycle
    runs-on: titan
    timeout-minutes: 60
    concurrency:
      group: agentic-sandbox-vm-e2e
      cancel-in-progress: false
    env:
      BASE_IMAGES_DIR: /build/agentic-sandbox/base-images
      VM_STORAGE_DIR: /build/agentic-sandbox/vms
      LIBVIRT_DEFAULT_URI: qemu:///system
      CELLD_QUALIFICATION_EXPECTED_HOST: titan
      CELLD_QUALIFICATION_EXPECTED_COMMIT: ${{ github.sha }}
      CELLD_QUALIFICATION_BUILD_ROOT: /build
      CELLD_QUALIFICATION_MIN_BUILD_FREE_GIB: "400"
      CELLD_QUALIFICATION_MIN_ROOT_FREE_GIB: "100"
      CELLD_QUALIFICATION_MIN_MEMORY_AVAILABLE_GIB: "32"
      CELLD_QUALIFICATION_MIN_CPU_COUNT: "8"
      CELLD_FLEET_CHANNEL: ${{ inputs.celld_channel }}
      CARGO_BUILD_JOBS: "8"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.celld-fleet-target

    steps:
      - name: Checkout exact fixture commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Fail-closed Titan capacity and provenance preflight
        run: |
          set -euo pipefail
          node scripts/celld-titan-preflight.mjs \
            --output artifacts/celld-fleet-titan-preflight.json

      - name: Validate focused fleet lifecycle contracts
        run: |
          set -euo pipefail
          node --test --test-concurrency=10 \
            tests/celld/uat/fleet-fixture.test.mjs \
            tests/celld/uat/seaweedfs-fixture.test.mjs \
            tests/celld/uat/titan-preflight.test.mjs \
            tests/celld/uat/titan-workflow.test.mjs
          cargo test --locked \
            --manifest-path tools/celld-callback-relay/Cargo.toml
          node scripts/celld-uat-contract-check.mjs

      - name: Verify selected Celld image channel and provenance
        run: |
          set -euo pipefail
          install -d -m 0700 artifacts
          case "${CELLD_FLEET_CHANNEL}" in
            approved)
              image="$(jq -er .celld.image deploy/celld/qualification/celld-images.json)"
              version="$(jq -er .celld.version deploy/celld/qualification/celld-images.json)"
              index_digest="$(jq -er .celld.index_digest deploy/celld/qualification/celld-images.json)"
              manifest_digest="$(jq -er .celld.manifest_digest deploy/celld/qualification/celld-images.json)"
              jq -n \
                --arg channel "${CELLD_FLEET_CHANNEL}" \
                --arg image "${image}" \
                --arg version "${version}" \
                --arg index_digest "${index_digest}" \
                --arg manifest_digest "${manifest_digest}" '
                  {
                    schema_version: "agentic-sandbox.celld-rollout-candidate-provenance/v1",
                    status: "NOT_REQUIRED",
                    channel: $channel,
                    qualification_status: "approved",
                    image_repository: $image,
                    version: $version,
                    index_digest: $index_digest,
                    manifest_digest: $manifest_digest
                  }
                ' > artifacts/celld-rollout-candidate-provenance.json
              ;;
            reviewed-candidate)
              node scripts/celld-rollout-candidate.mjs check \
                --input deploy/celld/qualification/celld-rollout-candidates.json \
                > artifacts/celld-rollout-candidate-inventory.json
              image="$(jq -er '.candidates[0].image' deploy/celld/qualification/celld-rollout-candidates.json)"
              version="$(jq -er '.candidates[0].version' deploy/celld/qualification/celld-rollout-candidates.json)"
              commit="$(jq -er '.candidates[0].commit' deploy/celld/qualification/celld-rollout-candidates.json)"
              index_digest="$(jq -er '.candidates[0].index_digest' deploy/celld/qualification/celld-rollout-candidates.json)"
              manifest_digest="$(jq -er '.candidates[0].manifest_digest' deploy/celld/qualification/celld-rollout-candidates.json)"
              config_digest="$(jq -er '.candidates[0].config_digest' deploy/celld/qualification/celld-rollout-candidates.json)"
              signer_identity="$(jq -er '.candidates[0].provenance.signer_identity' deploy/celld/qualification/celld-rollout-candidates.json)"
              source_repository="$(jq -er '.candidates[0].provenance.source_repository' deploy/celld/qualification/celld-rollout-candidates.json)"
              source_ref="$(jq -er '.candidates[0].provenance.source_ref' deploy/celld/qualification/celld-rollout-candidates.json)"
              predicate_type="$(jq -er '.candidates[0].provenance.predicate_type' deploy/celld/qualification/celld-rollout-candidates.json)"
              transparency_log="$(jq -er '.candidates[0].provenance.transparency_log' deploy/celld/qualification/celld-rollout-candidates.json)"
              command -v gh
              docker buildx version
              attestation="$(mktemp)"
              index_document="$(mktemp)"
              manifest_document="$(mktemp)"
              trap 'rm -- "${attestation}" "${index_document}" "${manifest_document}"' EXIT
              gh attestation verify \
                "oci://${image}@${index_digest}" \
                --repo denoland/celld \
                --bundle-from-oci \
                --format=json > "${attestation}"
              jq -e \
                --arg image "${image}" \
                --arg index_sha256 "${index_digest#sha256:}" \
                --arg commit "${commit}" \
                --arg signer "${signer_identity}" \
                --arg source "${source_repository}" \
                --arg ref "${source_ref}" \
                --arg predicate "${predicate_type}" \
                --arg tlog "${transparency_log}" '
                  length == 1 and
                  .[0].verificationResult.statement.subject == [{name: $image, digest: {sha256: $index_sha256}}] and
                  .[0].verificationResult.statement.predicateType == $predicate and
                  .[0].verificationResult.signature.certificate.subjectAlternativeName == $signer and
                  .[0].verificationResult.signature.certificate.issuer == "https://token.actions.githubusercontent.com" and
                  .[0].verificationResult.signature.certificate.sourceRepositoryURI == $source and
                  .[0].verificationResult.signature.certificate.sourceRepositoryRef == $ref and
                  .[0].verificationResult.signature.certificate.sourceRepositoryDigest == $commit and
                  .[0].verificationResult.signature.certificate.runnerEnvironment == "github-hosted" and
                  any(.[0].verificationResult.verifiedTimestamps[]; .type == "Tlog" and .uri == $tlog) and
                  any(.[0].verificationResult.statement.predicate.buildDefinition.resolvedDependencies[];
                    .digest.gitCommit == $commit and .uri == ("git+" + $source + "@" + $ref))
                ' "${attestation}" >/dev/null
              docker buildx imagetools inspect "${image}@${index_digest}" --raw > "${index_document}"
              jq -e --arg manifest "${manifest_digest}" '
                [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64" and .digest == $manifest)] | length == 1
              ' "${index_document}" >/dev/null
              docker buildx imagetools inspect "${image}@${manifest_digest}" --raw > "${manifest_document}"
              jq -e --arg config "${config_digest}" '.config.digest == $config' "${manifest_document}" >/dev/null
              jq -n \
                --arg channel "${CELLD_FLEET_CHANNEL}" \
                --arg image "${image}" \
                --arg version "${version}" \
                --arg commit "${commit}" \
                --arg index_digest "${index_digest}" \
                --arg manifest_digest "${manifest_digest}" \
                --arg config_digest "${config_digest}" \
                --arg signer_identity "${signer_identity}" \
                --arg source_repository "${source_repository}" \
                --arg source_ref "${source_ref}" \
                --arg predicate_type "${predicate_type}" \
                --arg transparency_log "${transparency_log}" '
                  {
                    schema_version: "agentic-sandbox.celld-rollout-candidate-provenance/v1",
                    status: "VERIFIED",
                    channel: $channel,
                    qualification_status: "reviewed_unqualified",
                    image_repository: $image,
                    version: $version,
                    commit: $commit,
                    index_digest: $index_digest,
                    manifest_digest: $manifest_digest,
                    config_digest: $config_digest,
                    provenance: {
                      predicate_type: $predicate_type,
                      subject_name: $image,
                      subject_digest: $index_digest,
                      signer_identity: $signer_identity,
                      source_repository: $source_repository,
                      source_ref: $source_ref,
                      source_commit: $commit,
                      runner_environment: "github-hosted",
                      transparency_log: $transparency_log
                    }
                  }
                ' > artifacts/celld-rollout-candidate-provenance.json
              ;;
            *)
              echo "::error::unknown CELLD_FLEET_CHANNEL"
              exit 3
              ;;
          esac
          {
            echo "CELLD_FLEET_EXPECTED_VERSION=${version}"
            echo "CELLD_FLEET_EXPECTED_MANIFEST_DIGEST=${manifest_digest}"
          } >> "${GITHUB_ENV}"

      - name: Preview stale owned fleet fixtures
        run: |
          set -euo pipefail
          install -d -m 0700 /dev/shm/agentic-celld-storage
          node scripts/celld-fleet-fixture.mjs janitor-preview \
            --root /dev/shm/agentic-celld-storage \
            --minimum-age-seconds 21600 | tee artifacts/celld-fleet-janitor-start.json

      - name: Prepare pinned storage and fleet inventories
        run: |
          set -euo pipefail
          run_id="titan-fleet-${GITHUB_RUN_ID}"
          run_root="/dev/shm/agentic-celld-storage/${run_id}"
          storage_config="${run_root}/fixture.json"
          fleet_config="${run_root}/fleet.json"
          {
            echo "CELLD_FLEET_RUN_ROOT=${run_root}"
            echo "CELLD_FLEET_STORAGE_CONFIG=${storage_config}"
            echo "CELLD_FLEET_CONFIG=${fleet_config}"
          } >> "${GITHUB_ENV}"
          node scripts/celld-seaweedfs-fixture.mjs prepare \
            --profile titan-single-host-storage \
            --run-id "${run_id}" \
            --root "${run_root}" \
            --output "${storage_config}"
          node scripts/celld-fleet-fixture.mjs prepare \
            --storage-config "${storage_config}" \
            --output "${fleet_config}" \
            --celld-channel "${CELLD_FLEET_CHANNEL}"

      - name: Start exact storage topology
        run: |
          set -euo pipefail
          node scripts/celld-seaweedfs-fixture.mjs start \
            --config "${CELLD_FLEET_STORAGE_CONFIG}"

      - name: Capture bounded storage startup diagnostics
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${CELLD_FLEET_STORAGE_CONFIG:-}" && -f "${CELLD_FLEET_STORAGE_CONFIG}" ]]; then
            node scripts/celld-seaweedfs-fixture.mjs diagnose \
              --config "${CELLD_FLEET_STORAGE_CONFIG}" \
              --output artifacts/celld-storage-startup-diagnostics.json
            jq -r '.logs' artifacts/celld-storage-startup-diagnostics.json
          fi

      - name: Install exact Worker deployment bundler
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --prefix runtimes/celld/instance-cell
          test -x runtimes/celld/instance-cell/node_modules/@esbuild/linux-x64/bin/esbuild

      - name: Build static fleet helpers from the exact commit
        run: |
          set -euo pipefail
          command -v musl-gcc
          command -v readelf
          rustup target list --installed | grep -Fx x86_64-unknown-linux-musl
          test "${CARGO_TARGET_DIR}" = "${GITHUB_WORKSPACE}/.celld-fleet-target"
          cargo build --locked --release \
            --manifest-path tools/celld-callback-relay/Cargo.toml \
            --target x86_64-unknown-linux-musl \
            --bins
          relay="${CARGO_TARGET_DIR}/x86_64-unknown-linux-musl/release/agentic-celld-callback-relay"
          credential_launcher="${CARGO_TARGET_DIR}/x86_64-unknown-linux-musl/release/agentic-celld-credential-launcher"
          for helper in "${relay}" "${credential_launcher}"; do
            test -x "${helper}"
            if readelf -l "${helper}" | grep -q 'INTERP'; then
              echo "::error::fleet helper must be a static executable: ${helper}"
              exit 3
            fi
          done
          credential_launcher_sha256="$(sha256sum "${credential_launcher}" | cut -d ' ' -f1)"
          echo "CELLD_CALLBACK_RELAY_BINARY=${relay}" >> "${GITHUB_ENV}"
          echo "CELLD_CREDENTIAL_LAUNCHER_BINARY=${credential_launcher}" >> "${GITHUB_ENV}"
          echo "CELLD_CREDENTIAL_LAUNCHER_SHA256=${credential_launcher_sha256}" >> "${GITHUB_ENV}"

      - name: Deploy reviewed reference Worker
        run: |
          set -euo pipefail
          node scripts/celld-fleet-fixture.mjs deploy \
            --config "${CELLD_FLEET_CONFIG}" \
            --credential-launcher "${CELLD_CREDENTIAL_LAUNCHER_BINARY}" \
            > artifacts/celld-worker-deployment.json
          expected_worker="$(jq -r .digest runtimes/celld/instance-cell/bundle.json)"
          jq -e \
            --arg run_id "titan-fleet-${GITHUB_RUN_ID}" \
            --arg expected_worker "${expected_worker}" \
            --arg expected_celld "${CELLD_FLEET_EXPECTED_MANIFEST_DIGEST}" \
            --arg expected_launcher "${CELLD_CREDENTIAL_LAUNCHER_SHA256}" '
              .schema_version == "agentic-sandbox.celld-worker-deployment/v1" and
              .run_id == $run_id and
              .scope == "single-host multi-node" and
              .worker_digest == $expected_worker and
              .celld_manifest_digest == $expected_celld and
              .credential_launcher_sha256 == $expected_launcher and
              .status == "DEPLOYED"
            ' artifacts/celld-worker-deployment.json >/dev/null

      - name: Start and diagnose exact three-node Celld fixture
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 20m \
            node scripts/celld-fleet-fixture.mjs start \
              --config "${CELLD_FLEET_CONFIG}" \
              --credential-launcher "${CELLD_CREDENTIAL_LAUNCHER_BINARY}" \
              > artifacts/celld-fleet-diagnosis.json
          jq -e \
            --arg channel "${CELLD_FLEET_CHANNEL}" \
            --arg expected_version "${CELLD_FLEET_EXPECTED_VERSION}" \
            --arg expected_manifest "${CELLD_FLEET_EXPECTED_MANIFEST_DIGEST}" '
            .schema_version == "agentic-sandbox.celld-fleet-diagnosis/v1" and
            .scope == "single-host multi-node" and
            .status == "READY" and
            .pins.celld_channel == $channel and
            .pins.celld.version == $expected_version and
            .pins.celld.manifest_digest == $expected_manifest and
            .membership.expected == 3 and
            .membership.running == 3 and
            .membership.reserve == 1 and
            .membership.probe == "passed"
          ' artifacts/celld-fleet-diagnosis.json >/dev/null

      - name: Start exact node-loopback mTLS callback relays
        run: |
          set -euo pipefail
          node scripts/celld-fleet-fixture.mjs start-relays \
            --config "${CELLD_FLEET_CONFIG}" \
            --relay-binary "${CELLD_CALLBACK_RELAY_BINARY}" \
            > artifacts/celld-callback-relays.json
          jq -e '
            .schema_version == "agentic-sandbox.celld-callback-relays/v1" and
            .scope == "single-host multi-node" and
            .status == "READY" and
            (.binary_sha256 | test("^[a-f0-9]{64}$")) and
            .client_cn == "agentic-celld-worker-callback" and
            (.relays | length) == 3 and
            ([.relays[] | select(.listener == "node-loopback" and .management_transport == "private-ca-mtls")] | length) == 3
          ' artifacts/celld-callback-relays.json >/dev/null

      - name: Probe exact deployed Worker authentication
        run: |
          set -euo pipefail
          node scripts/celld-fleet-fixture.mjs probe-worker \
            --config "${CELLD_FLEET_CONFIG}" \
            > artifacts/celld-worker-probe.json
          jq -e '
            .schema_version == "agentic-sandbox.celld-worker-probe/v1" and
            .scope == "single-host multi-node" and
            .status == "READY" and
            .checks.signed_missing_cell == {status: 404, code: "cell.missing"} and
            .checks.forged_signature == {status: 401, code: "cell.signature_invalid"} and
            .checks.nonce_replay == {status: 409, code: "cell.signature_replayed"}
          ' artifacts/celld-worker-probe.json >/dev/null

      - name: Collect redacted fixture inventory
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${CELLD_FLEET_RUN_ROOT:-}" && -f "${CELLD_FLEET_RUN_ROOT}/fleet-inventory.json" ]]; then
            jq '{schema_version,run_id,scope,owner,created_at,updated_at,state,resources,actions,diagnosis_sha256}' \
              "${CELLD_FLEET_RUN_ROOT}/fleet-inventory.json" \
              > artifacts/celld-fleet-inventory.json
          fi

      - name: Reap exact fleet resources
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${CELLD_FLEET_CONFIG:-}" && -f "${CELLD_FLEET_CONFIG}" ]]; then
            node scripts/celld-fleet-fixture.mjs cleanup \
              --config "${CELLD_FLEET_CONFIG}"
          fi

      - name: Reap exact storage resources
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${CELLD_FLEET_STORAGE_CONFIG:-}" && -f "${CELLD_FLEET_STORAGE_CONFIG}" ]]; then
            node scripts/celld-seaweedfs-fixture.mjs cleanup \
              --config "${CELLD_FLEET_STORAGE_CONFIG}"
          fi

      - name: Verify no exact-run Docker residue
        if: always()
        run: |
          set -euo pipefail
          run_id="titan-fleet-${GITHUB_RUN_ID}"
          residue="$(docker ps --all \
            --filter "label=dev.agentic-sandbox.repository=roctinam/agentic-sandbox" \
            --filter "label=dev.agentic-sandbox.workflow=celld-qualification" \
            --filter "label=dev.agentic-sandbox.run=${run_id}" \
            --format '{{.Names}}')"
          if [[ -n "${residue}" || -e "/dev/shm/agentic-celld-storage/${run_id}" ]]; then
            echo "::error::exact-run Celld fixture residue remains"
            printf '%s\n' "${residue}"
            exit 4
          fi

      - name: Preview remaining stale owned fleet fixtures
        if: always()
        run: |
          set -euo pipefail
          node scripts/celld-fleet-fixture.mjs janitor-preview \
            --root /dev/shm/agentic-celld-storage \
            --minimum-age-seconds 21600 | tee artifacts/celld-fleet-janitor-end.json

      - name: Upload fleet fixture evidence
        if: always()
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: celld-fleet-fixture-titan-${{ github.run_id }}
          path: |
            artifacts/celld-fleet-titan-preflight.json
            artifacts/celld-fleet-janitor-start.json
            artifacts/celld-storage-startup-diagnostics.json
            artifacts/celld-rollout-candidate-inventory.json
            artifacts/celld-rollout-candidate-provenance.json
            artifacts/celld-worker-deployment.json
            artifacts/celld-fleet-diagnosis.json
            artifacts/celld-callback-relays.json
            artifacts/celld-worker-probe.json
            artifacts/celld-fleet-inventory.json
            artifacts/celld-fleet-janitor-end.json
          if-no-files-found: warn
          retention-days: 90

      - name: Remove job-scoped fleet-helper compiler artifacts
        if: always()
        run: |
          set -euo pipefail
          target="${CARGO_TARGET_DIR}"
          test "${target}" = "${GITHUB_WORKSPACE}/.celld-fleet-target"
          cargo clean --manifest-path tools/celld-callback-relay/Cargo.toml --target-dir "${target}"
