name: Temporary Base Image Transfer Bridge

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: One-use build01 Ed25519 public key
        required: true
      marker_id:
        description: Bounded completion-marker identifier
        required: true
      expected_sha256:
        description: Expected Ubuntu base-image SHA-256
        required: true

jobs:
  transfer-window:
    name: Open bounded read-only Titan transfer window
    runs-on: titan
    timeout-minutes: 30
    steps:
      - name: Authorize one-use key until verified transfer completes
        env:
          TRANSFER_PUBLIC_KEY: ${{ inputs.public_key }}
          TRANSFER_MARKER_ID: ${{ inputs.marker_id }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail

          [[ "$TRANSFER_PUBLIC_KEY" =~ ^ssh-ed25519\ [A-Za-z0-9+/=]+\ build01-base-transfer-[0-9]{8}$ ]] || {
            echo "::error::invalid transfer public-key format"
            exit 1
          }
          [[ "$TRANSFER_MARKER_ID" =~ ^[a-z0-9-]{16,64}$ ]] || {
            echo "::error::invalid transfer marker identifier"
            exit 1
          }
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::invalid expected SHA-256"
            exit 1
          }

          base_image=/mnt/ops/base-images/ubuntu-server-24.04-agent.qcow2
          manifest=/mnt/ops/base-images/manifest.json
          marker="/tmp/agentic-base-transfer-${TRANSFER_MARKER_ID}.done"
          auth_dir="$HOME/.ssh"
          auth_file="$auth_dir/authorized_keys"

          test -r "$base_image"
          test -r "$manifest"
          actual_sha256="$(sha256sum "$base_image" | awk '{print $1}')"
          [[ "$actual_sha256" == "$EXPECTED_SHA256" ]] || {
            echo "::error::Titan base-image SHA-256 mismatch"
            exit 1
          }

          install -d -m 0700 "$auth_dir"
          touch "$auth_file"
          chmod 0600 "$auth_file"

          cleanup() {
            cleanup_file="$(mktemp "$auth_dir/authorized_keys.cleanup.XXXXXX")"
            grep -Fvx -- "$TRANSFER_PUBLIC_KEY" "$auth_file" > "$cleanup_file" || true
            chmod 0600 "$cleanup_file"
            mv -f -- "$cleanup_file" "$auth_file"
            rm -f -- "$marker"
          }
          trap cleanup EXIT INT TERM

          rm -f -- "$marker"
          if ! grep -Fxq -- "$TRANSFER_PUBLIC_KEY" "$auth_file"; then
            printf '%s\n' "$TRANSFER_PUBLIC_KEY" >> "$auth_file"
          fi

          echo "TRANSFER_READY host=$(hostname) marker=$marker sha256=$actual_sha256"
          deadline=$((SECONDS + 1500))
          while [[ ! -f "$marker" ]]; do
            if (( SECONDS >= deadline )); then
              echo "::error::transfer completion marker timed out"
              exit 1
            fi
            sleep 2
          done

          grep -Fxq -- "$EXPECTED_SHA256" "$marker" || {
            echo "::error::completion marker did not attest the expected SHA-256"
            exit 1
          }
          echo "TRANSFER_COMPLETE sha256=$actual_sha256 size=$(stat -c %s "$base_image")"
