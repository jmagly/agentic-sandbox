# Run the agentic-sandbox-conformance harness against this build (Wave 5 W5.4, #220).
#
# Boots the v2 management server with a tmpfs-backed TaskStore, then runs the
# harness from roctinam/agentic-sandbox-conformance against an ephemeral
# loopback port block.
# and uploads the markdown + JUnit reports as artifacts. Non-zero harness exit
# blocks merge.

name: Conformance

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      aiwg_ref:
        description: 'Exact AIWG ref for the fleet orchestration UAT'
        required: false
        default: 'd6027aaf939a13a9139fefb4dd29ed1bd2d25975'

concurrency:
  group: conformance-${{ gitea.head_ref || gitea.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Run conformance harness against this build
    # The harness uses loopback processes only; no KVM/libvirt substrate.
    runs-on: rust
    # Each qualified host runner has capacity one. Avoid a cross-workflow
    # job-level concurrency group: Gitea 1.25 can cancel the newly queued job
    # rather than serialize it. Fixed /tmp roots remain host-local.
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      # Conformance exercises behavior, not debugger symbol fidelity. Keeping
      # this profile non-incremental and symbol-free bounds checkout storage
      # while a shared runner is also serving the main CI workflow.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_INCREMENTAL: "false"
      RUST_MIN_STACK: "16777216"
      TEST_TOKEN: conformance-test-token
      # Fixed instance_id pre-registered by AIWG_CONFORMANCE_MODE=1.
      # See management/src/main.rs (search CONFORMANCE_INSTANCE_ID).
      CONFORMANCE_INSTANCE_ID: 00000000-0000-7000-8000-000000000001
      MGMT_BASE: http://127.0.0.1:8122
      EXECUTOR_URL: http://127.0.0.1:8122/agents/00000000-0000-7000-8000-000000000001
      ADMIN_URL: http://127.0.0.1:8122/api/v2/admin
    steps:
      - name: Checkout agentic-sandbox
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Checkout conformance harness
        # The conformance repository is public. Keep this as a shallow clone
        # to avoid a second action invocation and an unnecessary credential path.
        run: |
          set -euo pipefail
          git clone \
            --depth=1 \
            --branch main \
            --single-branch \
            https://git.integrolabs.net/roctinam/agentic-sandbox-conformance.git \
            conformance-harness
          git -C conformance-harness rev-parse HEAD

      - name: Prepare job-scoped compiler scratch
        run: |
          set -euo pipefail
          scratch="${GITHUB_WORKSPACE}/.ci-tmp"
          install -d -m 700 "$scratch"
          echo "TMPDIR=$scratch" >> "$GITHUB_ENV"
          echo "Compiler scratch: $scratch"
          df -h "$scratch"
          df -i "$scratch"

      - name: Report Rust toolchain
        working-directory: management
        run: |
          rustc --version --verbose
          cargo --version --verbose
          echo "CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS}"
          echo "CARGO_PROFILE_DEV_DEBUG=${CARGO_PROFILE_DEV_DEBUG}"
          echo "CARGO_PROFILE_DEV_INCREMENTAL=${CARGO_PROFILE_DEV_INCREMENTAL}"
          echo "RUST_MIN_STACK=${RUST_MIN_STACK}"
          echo "TMPDIR=${TMPDIR}"

      - name: Build executor crate (debug)
        working-directory: management
        run: |
          set -o pipefail
          LOG="${TMPDIR}/conformance-cargo-executor.log"
          export LOG
          bash ../scripts/ci-heartbeat.sh 60 "conformance cargo build executor" \
            bash -c 'set -o pipefail; cargo build -p agentic-sandbox-executor 2>&1 | tee "$LOG"'
          rc=$?
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if grep -Eq 'rustc interrupted|SIGSEGV|signal: 11' "$LOG"; then
            echo "cargo build hit a compiler crash; retrying once with serialized jobs"
            bash ../scripts/ci-heartbeat.sh 60 "conformance cargo build executor retry" \
              cargo build -j 1 -p agentic-sandbox-executor
            exit $?
          fi
          exit "$rc"

      - name: Build management server (debug)
        working-directory: management
        run: |
          set -o pipefail
          LOG="${TMPDIR}/conformance-cargo-mgmt.log"
          export LOG
          bash ../scripts/ci-heartbeat.sh 60 "conformance cargo build agentic-mgmt" \
            bash -c 'set -o pipefail; cargo build --bin agentic-mgmt 2>&1 | tee "$LOG"'
          rc=$?
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if grep -Eq 'rustc interrupted|SIGSEGV|signal: 11' "$LOG"; then
            echo "cargo build hit a compiler crash; retrying once with serialized jobs"
            bash ../scripts/ci-heartbeat.sh 60 "conformance cargo build agentic-mgmt retry" \
              cargo build -j 1 --bin agentic-mgmt
            exit $?
          fi
          exit "$rc"

      - name: Build harness
        working-directory: conformance-harness
        run: |
          go vet ./...
          mkdir -p ../bin
          go build -o ../bin/agentic-sandbox-conformance ./cmd/agentic-sandbox-conformance

      - name: Run conformance against ephemeral server
        id: harness
        env:
          SECRETS_DIR: /tmp/conformance-run/secrets
          RUST_LOG: info
          # Wires the mgmt binary's test-only conformance mode:
          # pre-registers a known ephemeral InstanceContext and binds
          # AcceptingMessageDispatch so the harness can exercise the
          # A2A surface without a backing runtime.
          AIWG_CONFORMANCE_MODE: "1"
        run: |
          set -euo pipefail
          # All-in-one step: `act` runs each step in its own bash process and
          # reaps background children when that bash exits, so the previous
          # split (start-in-step-A, wait-in-step-B) left a dead process by
          # the time healthz polled. Keep cleanup + dirs + token + server +
          # wait + harness + stop in one shell session so the server lives
          # for the entire job and inherits a clean runtime baseline.

          selected_grpc_port="$(python3 - <<'PY'
          import socket

          def free(port: int) -> bool:
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              try:
                  sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  sock.bind(("127.0.0.1", port))
                  return True
              except OSError:
                  return False
              finally:
                  sock.close()

          for grpc in range(19120, 19420):
              ports = [grpc, grpc + 1, grpc + 2]
              if all(free(port) for port in ports):
                  print(grpc)
                  break
          else:
              raise SystemExit("could not allocate three adjacent conformance management ports")
          PY
          )"
          http_port="$((selected_grpc_port + 2))"
          export LISTEN_ADDR="127.0.0.1:${selected_grpc_port}"
          export MGMT_BASE="http://127.0.0.1:${http_port}"
          export EXECUTOR_URL="${MGMT_BASE}/agents/${CONFORMANCE_INSTANCE_ID}"
          export ADMIN_URL="${MGMT_BASE}/api/v2/admin"
          echo "Selected conformance ports: grpc=${selected_grpc_port} ws=$((selected_grpc_port + 1)) http=${http_port}"

          # Kill any orphan from a previous job that still owns this selected
          # HTTP port. Without this, /healthz can answer from a stale server
          # but its SECRETS_DIR (a wiped tmpfs) and token don't match this run,
          # so authenticated/state-dependent tests fail opaquely.
          fuser -k "${http_port}/tcp" 2>/dev/null || true
          pkill -f 'target/debug/agentic-mgmt' 2>/dev/null || true
          # Give the kernel a beat to release the port before we try to bind.
          sleep 1

          # Wipe stale runtime state so the new server starts from a known
          # baseline (previous tmpfs may have leftover task store / secrets).
          rm -rf /tmp/conformance-run
          mkdir -p /tmp/conformance-run/secrets /tmp/conformance-run/tasks
          # Configure bearer auth for the configured conformance pass.
          # The harness also verifies that the same endpoint returns 401
          # when the token is omitted.
          printf '%s' "$TEST_TOKEN" > /tmp/conformance-run/secrets/admin.token
          chmod 600 /tmp/conformance-run/secrets/admin.token
          cat > /tmp/conformance-run/secrets/operator-tokens.toml <<EOF
          [[tokens]]
          token = "${TEST_TOKEN}"
          role = "admin"
          EOF
          chmod 600 /tmp/conformance-run/secrets/operator-tokens.toml

          ./management/target/debug/agentic-mgmt > /tmp/conformance-run/server.log 2>&1 &
          SERVER_PID=$!
          echo "${SERVER_PID}" > /tmp/conformance-run/server.pid

          # Always tear the server down, even if a step below fails.
          cleanup() {
            local rc=$?
            kill "${SERVER_PID}" 2>/dev/null || true
            wait "${SERVER_PID}" 2>/dev/null || true
            return $rc
          }
          trap cleanup EXIT

          # Debug-profile management binary on the runner can take 60s+ to
          # start under cold-cache I/O. healthz/http is the zero-shared-state
          # HTTP liveness surface, NOT under /agents/{id}.
          for i in $(seq 1 120); do
            if curl -fsS "${MGMT_BASE}/healthz/http" > /dev/null 2>&1; then
              echo "Server healthy after ${i}s"
              break
            fi
            if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
              echo "Server process exited before becoming healthy"
              tail -n 200 /tmp/conformance-run/server.log || true
              exit 1
            fi
            sleep 1
            if [ "$i" -eq 120 ]; then
              echo "Server did not become healthy in 120s"
              tail -n 200 /tmp/conformance-run/server.log || true
              exit 1
            fi
          done

          # Sanity-check that the pre-registered conformance instance is
          # reachable before invoking the harness. Surfaces a clear error
          # if AIWG_CONFORMANCE_MODE registration didn't fire.
          if ! curl -fsS -H "Authorization: Bearer ${TEST_TOKEN}" "${EXECUTOR_URL}/.well-known/agent-card.json" > /dev/null; then
            echo "Pre-registered conformance instance not reachable at ${EXECUTOR_URL}"
            tail -n 200 /tmp/conformance-run/server.log || true
            exit 1
          fi

          # Per-instance JWKS lives at .well-known/jwks.json on the
          # instance URL. Passing it lets the harness verify the
          # AgentCard's JWS signature against the published key.
          ./bin/agentic-sandbox-conformance \
            --executor-url "${EXECUTOR_URL}" \
            --admin-url "${ADMIN_URL}" \
            --jwks "${EXECUTOR_URL}/.well-known/jwks.json" \
            --token "${TEST_TOKEN}" \
            --report-format markdown,junit \
            --report-out conformance.report.md

      - name: Run restart durability tier
        env:
          TEST_TOKEN: conformance-test-token
          CONFORMANCE_INSTANCE_ID: 00000000-0000-7000-8000-000000000001
          RUST_LOG: info
          RESTART_DURABILITY_GRPC_PORT: "8130"
        run: |
          scripts/test-restart-durability.sh

      - name: Checkout exact AIWG fleet UAT ref
        env:
          AIWG_FLEET_UAT_REF: ${{ github.event.inputs.aiwg_ref || 'd6027aaf939a13a9139fefb4dd29ed1bd2d25975' }}
        run: |
          set -euo pipefail
          git init aiwg-fleet-uat
          git -C aiwg-fleet-uat remote add origin \
            https://git.integrolabs.net/roctinam/aiwg.git
          git -C aiwg-fleet-uat fetch --depth=1 origin "${AIWG_FLEET_UAT_REF}"
          git -C aiwg-fleet-uat checkout --detach FETCH_HEAD
          test "$(git -C aiwg-fleet-uat rev-parse HEAD)" = "${AIWG_FLEET_UAT_REF}"

      - name: Set up Node.js for AIWG fleet UAT
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: aiwg-fleet-uat/package-lock.json

      - name: Install AIWG fleet UAT dependencies
        working-directory: aiwg-fleet-uat
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm ci --ignore-scripts

      - name: Run AIWG three-target restart and re-adoption UAT
        working-directory: aiwg-fleet-uat
        env:
          AGENTIC_SANDBOX_MGMT_BIN: ${{ gitea.workspace }}/management/target/debug/agentic-mgmt
          AIWG_FLEET_SANDBOX_LIVE_REQUIRED: "1"
        run: |
          set -euo pipefail
          npm run uat:fleet-sandbox-live

      - name: Upload reports
        # Gitea Actions speaks the GHES artifact API — v4+ is rejected with
        # `GHESNotSupportedError`. Use @v3 until Gitea ships v4 support.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: conformance-reports
          path: |
            conformance.report.md
            conformance.report.junit.xml
            /tmp/conformance-run/server.log
            conformance.restart-durability.report.md
            conformance.restart-durability.server.log
            aiwg-fleet-uat/test-results/fleet-sandbox-live.junit.xml
            aiwg-fleet-uat/test-results/fleet-sandbox-live.evidence.json
          if-no-files-found: warn

      - name: Remove compiler scratch
        if: always()
        run: |
          set -euo pipefail
          scratch="${GITHUB_WORKSPACE}/.ci-tmp"
          case "$scratch" in
            "${GITHUB_WORKSPACE}/.ci-tmp") rm -rf -- "$scratch" ;;
            *)
              echo "::error::refusing to clean unexpected compiler scratch path: $scratch"
              exit 1
              ;;
          esac
