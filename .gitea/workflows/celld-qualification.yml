name: Celld Qualification on Titan

on:
  workflow_dispatch:
    inputs:
      qualification_lane:
        description: "Strict evidence lane; complete is the only consolidated UAT 003-015 selection"
        required: true
        default: complete
        type: choice
        options:
          - complete
          - issue-764
          - issue-765
          - issue-767
          - issue-771
      allow_destructive_faults:
        description: "Allow implemented disposable fault-injection executors (never production resources)"
        required: false
        default: false
        type: boolean

# Qualification never cancels an in-flight run: cancellation can bypass host
# cleanup. The job-level group also serializes with the repository's existing
# VM E2E matrix on the shared Titan libvirt substrate.
concurrency:
  group: agentic-sandbox-celld-qualification-titan
  cancel-in-progress: false

jobs:
  automated-qualification:
    name: Automated Celld UAT 003-015
    runs-on: titan
    timeout-minutes: 480
    concurrency:
      group: agentic-sandbox-vm-e2e
      cancel-in-progress: false
    env:
      BASE_IMAGES_DIR: /build/agentic-sandbox/base-images
      VM_STORAGE_DIR: /build/agentic-sandbox/vms
      LIBVIRT_DEFAULT_URI: qemu:///system
      AGENTIC_BACKEND: libvirt
      AGENTSHARE_ROOT: /var/tmp/agentic-celld-qualification-${{ github.run_id }}/mount
      AGENTSHARE_BACKING_FILE: /var/tmp/agentic-celld-qualification-${{ github.run_id }}/agentshare.xfs
      CARGO_BUILD_JOBS: "8"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.celld-target
      CELLD_QUALIFICATION_EXPECTED_HOST: titan
      CELLD_QUALIFICATION_EXPECTED_COMMIT: ${{ github.sha }}
      CELLD_QUALIFICATION_BUILD_ROOT: /build
      CELLD_QUALIFICATION_MIN_BUILD_FREE_GIB: "400"
      CELLD_QUALIFICATION_MIN_ROOT_FREE_GIB: "100"
      CELLD_QUALIFICATION_MIN_MEMORY_AVAILABLE_GIB: "32"
      CELLD_QUALIFICATION_MIN_CPU_COUNT: "8"
      CELLD_QUALIFICATION_MAX_RETAINED_GIB: "10"
      CELLD_QUALIFICATION_ALLOW_DESTRUCTIVE_FAULTS: ${{ inputs.allow_destructive_faults }}
      CELLD_QUALIFICATION_LANE: ${{ inputs.qualification_lane }}
      E2E_VM_SETUP: "1"
      E2E_CLEANUP_VM: "1"
      E2E_REUSE_VM: "0"
      E2E_VM_READY_TIMEOUT: "900"
      E2E_REQUIRE_AGENTSHARE: "1"
      E2E_REQUIRE_AGENTSHARE_QUOTA: "1"
      E2E_DISK_QUOTA: "2G"
      AGENTIC_VM_SSH_WAIT_SECONDS: "900"
      AGENTIC_AGENTSHARE_READY_TIMEOUT_SECONDS: "600"

    steps:
      - name: Checkout exact qualification commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Fail-closed Titan capacity and provenance preflight
        run: |
          set -euo pipefail
          node scripts/celld-titan-preflight.mjs \
            --output artifacts/celld-titan-preflight.json

      - name: Resolve strict qualification lane
        run: |
          set -euo pipefail
          node scripts/celld-qualification-lanes.mjs \
            --lane "${CELLD_QUALIFICATION_LANE}" \
            --format github-env >> "${GITHUB_ENV}"

      - name: Validate exact-head qualification readiness
        run: |
          set -euo pipefail
          node scripts/celld-qualification-readiness.mjs \
            --lane "${CELLD_QUALIFICATION_LANE}" \
            --expected-git "${GITHUB_SHA}" \
            --output artifacts/celld-qualification-readiness.json

      - name: Prepare job-scoped compiler scratch
        run: |
          set -euo pipefail
          test "${CARGO_TARGET_DIR}" = "${GITHUB_WORKSPACE}/.celld-target"
          test ! -e "${CARGO_TARGET_DIR}"
          install -d -m 0700 "${GITHUB_WORKSPACE}/.ci-tmp"
          echo "TMPDIR=${GITHUB_WORKSPACE}/.ci-tmp" >> "${GITHUB_ENV}"

      - name: Preview stale disposable E2E cleanup
        run: |
          set -euo pipefail
          sudo -n env AGENTIC_BACKEND=libvirt \
            scripts/reap-e2e-vms.sh \
              --dry-run \
              --backend libvirt \
              --vm-root "${VM_STORAGE_DIR}" \
              --virsh-uri "${LIBVIRT_DEFAULT_URI}"

      - name: Reap stale disposable E2E resources
        run: |
          set -euo pipefail
          sudo -n env AGENTIC_BACKEND=libvirt \
            scripts/reap-e2e-vms.sh \
              --backend libvirt \
              --vm-root "${VM_STORAGE_DIR}" \
              --virsh-uri "${LIBVIRT_DEFAULT_URI}"

      - name: Create isolated quota-backed agentshare
        run: |
          set -euo pipefail
          command -v mkfs.xfs
          command -v xfs_quota
          storage_dir="$(dirname "${AGENTSHARE_ROOT}")"
          [[ "${storage_dir}" =~ ^/var/tmp/agentic-celld-qualification-[0-9]+$ ]] || {
            echo "::error::refusing unexpected agentshare path: ${storage_dir}"
            exit 1
          }
          test ! -e "${storage_dir}"
          sudo -n env \
            AGENTSHARE_ROOT="${AGENTSHARE_ROOT}" \
            AGENTSHARE_BACKING_FILE="${AGENTSHARE_BACKING_FILE}" \
            AGENTSHARE_SIZE_GIB=8 \
            AGENTSHARE_PERSIST=0 \
            AGENTSHARE_STORAGE_MODE=loopback \
            images/qemu/setup-agentshare.sh
          sudo -n env \
            AGENTSHARE_ROOT="${AGENTSHARE_ROOT}" \
            AGENTIC_REQUIRE_DEDICATED_AGENTSHARE=1 \
            scripts/verify-container-security.sh

      - name: Validate structured UAT and evidence contracts
        run: |
          set -euo pipefail
          make test-celld-uat-structure

      - name: Build exact live orchestration executables and Docker substrate
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path management/Cargo.toml
          cargo build --locked --release --manifest-path agent-rs/Cargo.toml
          rustup target add x86_64-unknown-linux-musl
          cargo_home="${CARGO_HOME:-${HOME}/.cargo}"
          helper_rustflags="--remap-path-prefix=${GITHUB_WORKSPACE}=/workspace --remap-path-prefix=${cargo_home}=/cargo-home"
          # The root-installed QEMU cleanup helper is byte-checked against this
          # freshly built candidate. Keep the helper/relay build reproducible
          # across the operator install path and the transient runner checkout.
          export SOURCE_DATE_EPOCH=0
          export CARGO_INCREMENTAL=0
          CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/tools/celld-callback-relay/target" \
          RUSTFLAGS="${helper_rustflags}" \
          cargo build --locked --release \
            --target x86_64-unknown-linux-musl \
            --manifest-path tools/celld-callback-relay/Cargo.toml
          npm ci --no-audit --no-fund --prefix runtimes/celld/instance-cell/
          docker_tag="agentic-celld-qualification-agent:${GITHUB_RUN_ID}"
          echo "CELLD_ORCHESTRATION_DOCKER_TAG=${docker_tag}" >> "${GITHUB_ENV}"
          docker build \
            --file images/container/Dockerfile.base \
            --build-arg "CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS}" \
            --tag "${docker_tag}" \
            .
          docker_image_ref="$(docker image inspect --format '{{.Id}}' "${docker_tag}")"
          [[ "${docker_image_ref}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "CELLD_ORCHESTRATION_DOCKER_IMAGE_REF=${docker_image_ref}" >> "${GITHUB_ENV}"

      - name: Discover and recover retained same-run orchestration inventory
        run: |
          set -euo pipefail
          node scripts/celld-live-orchestration.mjs recover-retained \
            --run-id "titan-${GITHUB_RUN_ID}" \
            --orchestration-root /dev/shm/agentic-celld-orchestration \
            --retained-run-root "/dev/shm/agentic-celld-orchestration/titan-${GITHUB_RUN_ID}" \
            --profile "/dev/shm/agentic-celld-storage/titan-${GITHUB_RUN_ID}/live-profile.json" \
            --exact-run-owner "titan-${GITHUB_RUN_ID}"

      - name: Prepare pinned storage candidate for UAT-010
        run: |
          set -euo pipefail
          run_id="titan-${GITHUB_RUN_ID}"
          fixture_root="/dev/shm/agentic-celld-storage/${run_id}"
          fixture_config="${fixture_root}/fixture.json"
          live_profile="${fixture_root}/live-profile.json"
          orchestration_root="/dev/shm/agentic-celld-orchestration/${run_id}"
          orchestration_config="${orchestration_root}/orchestration.json"
          orchestration_inventory="${orchestration_root}/orchestration-inventory.json"
          credential_provenance_config="${orchestration_root}/credential-provenance.json"
          migration_destination_run_id="${run_id}-migration-destination"
          migration_destination_root="/dev/shm/agentic-celld-migration/${migration_destination_run_id}"
          {
            echo "CELLD_STORAGE_FIXTURE_CONFIG=${fixture_config}"
            echo "CELLD_STORAGE_LIVE_PROFILE=${live_profile}"
            echo "CELLD_ORCHESTRATION_CONFIG=${orchestration_config}"
            echo "CELLD_ORCHESTRATION_INVENTORY=${orchestration_inventory}"
            echo "CELLD_CREDENTIAL_PROVENANCE_CONFIG=${credential_provenance_config}"
            echo "CELLD_MIGRATION_SOURCE_FLEET_CONFIG=${fixture_root}/fleet.json"
            echo "CELLD_MIGRATION_DESTINATION_RUN_ID=${migration_destination_run_id}"
            echo "CELLD_MIGRATION_DESTINATION_ROOT=${migration_destination_root}"
            echo "CELLD_MIGRATION_DESTINATION_CONFIG=${migration_destination_root}/fixture.json"
            echo "CELLD_MIGRATION_DESTINATION_FLEET_CONFIG=${migration_destination_root}/fleet.json"
          } >> "${GITHUB_ENV}"
          node scripts/celld-seaweedfs-fixture.mjs prepare \
            --profile titan-single-host-storage \
            --run-id "${run_id}" \
            --root "${fixture_root}" \
            --output "${fixture_config}"
          node scripts/celld-live-orchestration.mjs prepare \
            --run-id "${run_id}" \
            --working-root "${orchestration_root}" \
            --management-binary "${CARGO_TARGET_DIR}/release/agentic-mgmt" \
            --agent-client-binary "${CARGO_TARGET_DIR}/release/agent-client" \
            --relay-binary "${GITHUB_WORKSPACE}/tools/celld-callback-relay/target/x86_64-unknown-linux-musl/release/agentic-celld-callback-relay" \
            --docker-image-ref "${CELLD_ORCHESTRATION_DOCKER_IMAGE_REF}" \
            --agentshare-root "${AGENTSHARE_ROOT}" \
            --management-grpc-port 38120
          jq -n \
            --arg run_id "${run_id}" \
            '{schema_version: "agentic-sandbox.celld-live-credential-provenance/v1", run_id: $run_id, mode: "prerequisite-assessment"}' \
            > "${credential_provenance_config}"
          chmod 0600 "${credential_provenance_config}"
          host_sha256="$(printf '%s' "$(hostname)" | sha256sum | awk '{print $1}')"
          destructive_faults="${CELLD_QUALIFICATION_ALLOW_DESTRUCTIVE_FAULTS}"
          case "${destructive_faults}" in
            true|false) ;;
            *) echo "::error::destructive fault input must be true or false"; exit 3 ;;
          esac
          jq -n \
            --arg run_id "${run_id}" \
            --arg git "${GITHUB_SHA}" \
            --arg host_sha256 "${host_sha256}" \
            --arg inventory "${orchestration_inventory}" \
            --arg config "${fixture_config}" \
            --arg orchestration_config "${orchestration_config}" \
            --arg credential_provenance_config "${credential_provenance_config}" \
            --argjson destructive_faults "${destructive_faults}" \
            --argjson orchestration_enabled "${CELLD_QUALIFICATION_ENABLE_ORCHESTRATION}" \
            --argjson worker_enabled "${CELLD_QUALIFICATION_ENABLE_WORKER}" \
            --argjson network_auth_enabled "${CELLD_QUALIFICATION_ENABLE_NETWORK_AUTH}" \
            --argjson credential_provenance_enabled "${CELLD_QUALIFICATION_ENABLE_CREDENTIAL_PROVENANCE}" \
            --argjson rollout_enabled "${CELLD_QUALIFICATION_ENABLE_ROLLOUT}" \
            --argjson observability_enabled "${CELLD_QUALIFICATION_ENABLE_OBSERVABILITY}" \
            --argjson recovery_enabled "${CELLD_QUALIFICATION_ENABLE_RECOVERY}" \
            --argjson storage_topology_enabled "${CELLD_QUALIFICATION_ENABLE_STORAGE_TOPOLOGY}" \
            '{
              schema_version: "agentic-sandbox.celld-live-profile/v1",
              profile_id: ("titan-qualification-" + env.GITHUB_RUN_ID),
              run_id: $run_id,
              expected_sandbox_git: $git,
              environment: {kind: "titan-single-host", single_host: true, host_sha256: $host_sha256},
              authorization: {destructive_faults: $destructive_faults, inventory_path: $inventory, exact_run_owner: $run_id},
              drivers: {
                "celld-live-orchestration": {enabled: $orchestration_enabled, config_path: $orchestration_config},
                "celld-live-worker": {enabled: $worker_enabled, config_path: $orchestration_config},
                "celld-live-network-auth": {enabled: $network_auth_enabled, config_path: $orchestration_config},
                "celld-live-credential-provenance": {enabled: $credential_provenance_enabled, config_path: $credential_provenance_config},
                "celld-live-rollout": {enabled: $rollout_enabled, config_path: $orchestration_config},
                "celld-live-observability": {enabled: $observability_enabled, config_path: $orchestration_config},
                "celld-live-recovery": {enabled: $recovery_enabled, config_path: $orchestration_config},
                "celld-live-storage-topology": {enabled: $storage_topology_enabled, config_path: $config}
              }
            }' > "${live_profile}"
          chmod 0600 "${live_profile}"

      - name: Validate generated live profile readiness
        run: |
          set -euo pipefail
          node scripts/celld-qualification-readiness.mjs \
            --lane "${CELLD_QUALIFICATION_LANE}" \
            --expected-git "${GITHUB_SHA}" \
            --profile "${CELLD_STORAGE_LIVE_PROFILE}" \
            --output artifacts/celld-qualification-profile-readiness.json

      - name: Recover exact orchestration inventory before qualification
        run: |
          set -euo pipefail
          if [[ "${CELLD_QUALIFICATION_ENABLE_ORCHESTRATION}" != "true" ]]; then
            echo "Skipping orchestration recovery outside an enabled live-orchestration lane"
            exit 0
          fi
          node scripts/celld-live-orchestration.mjs recover \
            --config "${CELLD_ORCHESTRATION_CONFIG}" \
            --profile "${CELLD_STORAGE_LIVE_PROFILE}"

      - name: Qualify destination and rehearse verified offline object-store migration
        run: |
          set -euo pipefail
          if [[ "${CELLD_QUALIFICATION_RUN_MIGRATION}" != "true" ]]; then
            echo "Skipping offline migration outside the complete/#771 lane"
            exit 0
          fi
          node scripts/celld-live-offline-migration.mjs \
            --source-config "${CELLD_STORAGE_FIXTURE_CONFIG}" \
            --destination-run-id "${CELLD_MIGRATION_DESTINATION_RUN_ID}" \
            --destination-root "${CELLD_MIGRATION_DESTINATION_ROOT}" \
            --artifact "${GITHUB_WORKSPACE}/artifacts/celld-offline-migration.json"
          sha256sum \
            artifacts/celld-offline-migration.json \
            artifacts/celld-offline-migration-destination-qualification.json \
            artifacts/celld-offline-migration-destination-qualification.jsonl \
            > artifacts/celld-offline-migration-manifest.sha256
          sha256sum --check artifacts/celld-offline-migration-manifest.sha256

      - name: Execute automated Celld qualification catalog
        run: |
          set -euo pipefail
          if [[ "${CELLD_QUALIFICATION_RUN_CATALOG}" != "true" ]]; then
            echo "Skipping UAT catalog for the offline-migration-only lane"
            exit 0
          fi
          run_id="titan-${GITHUB_RUN_ID}"
          rc=0
          selected_ids="${CELLD_QUALIFICATION_SELECTED_IDS}"
          [[ "${selected_ids}" =~ ^UAT-CELLD-[0-9]{3}(,UAT-CELLD-[0-9]{3})*$ ]]
          test "$(tr ',' '\n' <<<"${selected_ids}" | wc -l)" -eq "${CELLD_QUALIFICATION_EXPECTED_COUNT}"
          timeout --signal=TERM --kill-after=180s 420m \
            node scripts/run-celld-uat.mjs \
              --id "${selected_ids}" \
              --run-id "${run_id}" \
              --live-profile "${CELLD_STORAGE_LIVE_PROFILE}" || rc=$?
          if [[ "${rc}" -eq 124 || "${rc}" -eq 137 ]]; then
            echo "::error::Celld qualification exceeded the 420m shell timeout"
            exit 3
          fi
          exit "${rc}"

      - name: Reap exact offline-migration fixtures
        if: always()
        run: |
          set -euo pipefail
          if [[ -f artifacts/celld-offline-migration-error.json ]] && jq -e '.retain_namespaces == true' artifacts/celld-offline-migration-error.json >/dev/null; then
            echo "::warning::retaining stopped, write-denied migration namespaces for operator recovery"
            exit 0
          fi
          cleanup_rc=0
          for fleet_config in \
            "${CELLD_MIGRATION_DESTINATION_FLEET_CONFIG:-}" \
            "${CELLD_MIGRATION_SOURCE_FLEET_CONFIG:-}"; do
            if [[ -n "${fleet_config}" && -f "${fleet_config}" ]]; then
              node scripts/celld-fleet-fixture.mjs cleanup --config "${fleet_config}" || cleanup_rc=4
            fi
          done
          if [[ -n "${CELLD_MIGRATION_DESTINATION_CONFIG:-}" && -f "${CELLD_MIGRATION_DESTINATION_CONFIG}" ]]; then
            node scripts/celld-seaweedfs-fixture.mjs cleanup --config "${CELLD_MIGRATION_DESTINATION_CONFIG}" || cleanup_rc=4
          fi
          if [[ -n "${CELLD_MIGRATION_DESTINATION_ROOT:-}" && -d "${CELLD_MIGRATION_DESTINATION_ROOT}" ]]; then
            rmdir "${CELLD_MIGRATION_DESTINATION_ROOT}" || cleanup_rc=4
          fi
          if [[ -d /dev/shm/agentic-celld-migration ]]; then
            rmdir /dev/shm/agentic-celld-migration || cleanup_rc=4
          fi
          exit "${cleanup_rc}"

      - name: Reap exact orchestration controller state
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${CELLD_ORCHESTRATION_CONFIG:-}" && -f "${CELLD_ORCHESTRATION_CONFIG}" ]]; then
            cleanup_rc=0
            node scripts/celld-live-worker.mjs cleanup --config "${CELLD_ORCHESTRATION_CONFIG}" || cleanup_rc=4
            node scripts/celld-live-network-auth.mjs cleanup --config "${CELLD_ORCHESTRATION_CONFIG}" || cleanup_rc=4
            node scripts/celld-live-orchestration.mjs cleanup --config "${CELLD_ORCHESTRATION_CONFIG}" --profile "${CELLD_STORAGE_LIVE_PROFILE}" || cleanup_rc=4
            rmdir /dev/shm/agentic-celld-orchestration 2>/dev/null || cleanup_rc=4
            exit "${cleanup_rc}"
          fi

      - name: Reap exact storage fixture
        if: always()
        run: |
          set -euo pipefail
          if [[ -f artifacts/celld-offline-migration-error.json ]] && jq -e '.retain_namespaces == true' artifacts/celld-offline-migration-error.json >/dev/null; then
            echo "::warning::source namespace retained by migration failure contract"
            exit 0
          fi
          if [[ -n "${CELLD_STORAGE_FIXTURE_CONFIG:-}" && -f "${CELLD_STORAGE_FIXTURE_CONFIG}" ]]; then
            node scripts/celld-seaweedfs-fixture.mjs cleanup --config "${CELLD_STORAGE_FIXTURE_CONFIG}"
            rmdir /dev/shm/agentic-celld-storage 2>/dev/null || true
          fi

      - name: Remove exact orchestration Docker image
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${CELLD_ORCHESTRATION_DOCKER_TAG:-}" ]]; then
            docker image rm "${CELLD_ORCHESTRATION_DOCKER_TAG}"
          fi

      - name: Preview final disposable E2E cleanup
        if: always()
        run: |
          set -euo pipefail
          sudo -n env AGENTIC_BACKEND=libvirt \
            scripts/reap-e2e-vms.sh \
              --dry-run \
              --backend libvirt \
              --vm-root "${VM_STORAGE_DIR}" \
              --virsh-uri "${LIBVIRT_DEFAULT_URI}"

      - name: Reap qualification E2E resources
        if: always()
        run: |
          set -euo pipefail
          sudo -n env AGENTIC_BACKEND=libvirt \
            scripts/reap-e2e-vms.sh \
              --backend libvirt \
              --vm-root "${VM_STORAGE_DIR}" \
              --virsh-uri "${LIBVIRT_DEFAULT_URI}"

      - name: Verify qualification VM cleanup
        if: always()
        run: |
          set -euo pipefail
          domains="$(virsh -c "${LIBVIRT_DEFAULT_URI}" list --all --name | grep -E '^agentic-e2e-[0-9]+$' || true)"
          directories="$(sudo -n find "${VM_STORAGE_DIR}" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep -E '^agentic-e2e-[0-9]+$' || true)"
          if [[ -n "${domains}" || -n "${directories}" ]]; then
            echo "::error::disposable qualification resources remain"
            printf 'domains=%s\ndirectories=%s\n' "${domains}" "${directories}"
            exit 4
          fi

      - name: Remove isolated agentshare
        if: always()
        run: |
          set -euo pipefail
          storage_dir="$(dirname "${AGENTSHARE_ROOT}")"
          [[ "${storage_dir}" =~ ^/var/tmp/agentic-celld-qualification-[0-9]+$ ]] || {
            echo "::error::refusing unexpected agentshare cleanup path: ${storage_dir}"
            exit 1
          }
          if mountpoint -q "${AGENTSHARE_ROOT}"; then
            sudo -n umount "${AGENTSHARE_ROOT}"
          fi
          if [[ -e "${AGENTSHARE_BACKING_FILE}" ]]; then
            sudo -n unlink "${AGENTSHARE_BACKING_FILE}"
          fi
          sudo -n rmdir "${AGENTSHARE_ROOT}" "${storage_dir}" 2>/dev/null || true

      - name: Remove job-scoped compiler artifacts
        if: always()
        run: |
          set -euo pipefail
          target="${CARGO_TARGET_DIR}"
          scratch="${GITHUB_WORKSPACE}/.ci-tmp"
          test "${target}" = "${GITHUB_WORKSPACE}/.celld-target"
          test "${scratch}" = "${GITHUB_WORKSPACE}/.ci-tmp"
          du -sh "${target}" "${scratch}" 2>/dev/null || true
          cargo clean --manifest-path management/Cargo.toml --target-dir "${target}"
          echo "TMPDIR=/tmp" >> "${GITHUB_ENV}"
          rm -rf -- "${scratch}"

      - name: Verify post-run resource and capacity baseline
        if: always()
        run: |
          set -euo pipefail
          node scripts/celld-titan-postflight.mjs \
            --preflight artifacts/celld-titan-preflight.json \
            --output artifacts/celld-titan-postflight.json

      - name: Record post-run capacity
        if: always()
        run: |
          set -euo pipefail
          df -h / /build
          free -h
          docker system df

      - name: Report bounded qualification verdict
        if: always()
        run: |
          set -euo pipefail
          result_dir="tests/celld/uat/results/titan-${GITHUB_RUN_ID}"
          if [[ -f "${result_dir}/summary.json" ]]; then
            jq '{run_id, counts, supporting_checks, lane_verdicts, issue_verdicts, hard_gate_failures}' \
              "${result_dir}/summary.json"
          fi
          if [[ -f "${result_dir}/evidence.jsonl" ]]; then
            jq -c 'select(.status == "FAIL" or .status == "ERROR") | {
              scenario_id,
              status,
              reason_code,
              cleanup,
              assertions: [.assertions[] | {id, status, reason}],
              command: (if .command == null then null else {
                exit_code: .command.exit_code,
                signal: .command.signal,
                stdout_tail: .command.stdout_tail,
                stderr_tail: .command.stderr_tail
              } end)
            }' "${result_dir}/evidence.jsonl"
          fi

      - name: Verify generated evidence manifest
        if: always()
        run: |
          set -euo pipefail
          result_dir="tests/celld/uat/results/titan-${GITHUB_RUN_ID}"
          if [[ -d "${result_dir}" ]]; then
            test -f "${result_dir}/manifest.sha256"
            (cd "${result_dir}" && sha256sum --check manifest.sha256)
          else
            echo "::warning::qualification result directory was not created; retaining preflight evidence only"
          fi

      - name: Verify offline-migration evidence manifest
        if: always()
        run: |
          set -euo pipefail
          if [[ -f artifacts/celld-offline-migration-manifest.sha256 ]]; then
            sha256sum --check artifacts/celld-offline-migration-manifest.sha256
          else
            echo "::warning::offline migration did not reach its complete evidence boundary"
          fi

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: celld-qualification-titan-${{ github.run_id }}
          path: |
            artifacts/celld-titan-preflight.json
            artifacts/celld-titan-postflight.json
            artifacts/celld-qualification-readiness.json
            artifacts/celld-qualification-profile-readiness.json
            artifacts/celld-offline-migration*
            tests/celld/uat/results/titan-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 90
