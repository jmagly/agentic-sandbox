name: Runner Maintenance

env:
  GITEA_RUNNER_VERSION: "3.3.2"
  GITEA_RUNNER_LINUX_AMD64_SHA256: "38b73d0d82172830c4f14f10d0300ab744914552f4dab1a972d177921faf0983"

on:
  workflow_dispatch:

jobs:
  audit-build01:
    name: Audit build01 toolchain and host contract
    runs-on: s9-build
    timeout-minutes: 10
    steps:
      - name: Inventory host
        run: |
          set -euo pipefail
          echo "host=$(hostname)"
          id
          uname -a
          command -v rustup || true
          command -v rustc || true
          command -v cargo || true
          rustup show 2>/dev/null || true
          rustup check 2>/dev/null || true
          rustc --version --verbose 2>/dev/null || true
          cargo --version --verbose 2>/dev/null || true
          command -v docker && docker version --format 'docker client={{.Client.Version}} server={{.Server.Version}}'
          command -v virsh && virsh --connect qemu:///system uri
          test -r /dev/kvm && test -w /dev/kvm && echo 'kvm=rw' || echo 'kvm=unavailable'
          echo 'mount-table-before-path-probes:'
          awk '$5 == "/build" || $5 ~ /^\/build\// || $5 == "/mnt/ops" || $5 ~ /^\/mnt\/ops\// { print }' /proc/self/mountinfo
          bounded_path_probe() {
            path="$1"
            if timeout --signal=TERM --kill-after=1s 5s \
              bash -c 'if test -e "$1"; then stat -c '\''%n type=%F mode=%a owner=%U group=%G'\'' "$1"; else echo "$1 MISSING"; fi' \
              bash "$path"; then
              return 0
            fi
            rc=$?
            if test "$rc" -eq 124 || test "$rc" -eq 137; then
              echo "::error::path-probe-timeout path=${path} timeout=5s"
            else
              echo "::error::path-probe-failed path=${path} status=${rc}"
            fi
            return "$rc"
          }
          for path in /build/agentic-sandbox/base-images /build/agentic-sandbox/vms; do
            bounded_path_probe "$path"
          done
          command -v gitea-runner && gitea-runner --version
          ps -eo pid,user,args | grep '[g]itea-runner' || true
          runner_pid="$(pgrep -f '/usr/local/bin/gitea-runner daemon --config ' | head -n1 || true)"
          if test -n "$runner_pid"; then
            ps -o pid,ppid,user,lstart,args -p "$runner_pid"
            cat "/proc/${runner_pid}/cgroup" || true
          fi
          timeout --signal=TERM --kill-after=1s 5s findmnt -T /build 2>/dev/null || true
          timeout --signal=TERM --kill-after=1s 5s findmnt -T /mnt/ops 2>/dev/null || true
          timeout --signal=TERM --kill-after=1s 5s df -h / /build /mnt/ops 2>/dev/null || true
          if test -r /srv/gitea-runner-host/config.yaml; then
            sed -n '/^[[:space:]]*labels:/,/^[^[:space:]]/p' /srv/gitea-runner-host/config.yaml
          fi
          systemctl --user list-unit-files --type=service 2>/dev/null | grep -Ei 'gitea|runner' || true
          sudo -n systemctl list-unit-files --type=service 2>/dev/null | grep -Ei 'gitea|runner' || true
          systemctl --user --no-pager --full status gitea-runner 2>/dev/null || true
          sudo -n systemctl --no-pager --full status gitea-act-runner-build01 2>/dev/null || true

  audit-titan:
    name: Audit Titan toolchain and host contract
    runs-on: titan
    timeout-minutes: 10
    steps:
      - name: Inventory host
        run: |
          set -euo pipefail
          echo "host=$(hostname)"
          id
          uname -a
          command -v rustup || true
          command -v rustc || true
          command -v cargo || true
          rustup show 2>/dev/null || true
          rustup check 2>/dev/null || true
          rustc --version --verbose 2>/dev/null || true
          cargo --version --verbose 2>/dev/null || true
          command -v docker && docker version --format 'docker client={{.Client.Version}} server={{.Server.Version}}'
          command -v virsh && virsh --connect qemu:///system uri
          test -r /dev/kvm && test -w /dev/kvm && echo 'kvm=rw' || echo 'kvm=unavailable'
          echo 'mount-table-before-path-probes:'
          awk '$5 == "/build" || $5 ~ /^\/build\// || $5 == "/mnt/ops" || $5 ~ /^\/mnt\/ops\// { print }' /proc/self/mountinfo
          bounded_path_probe() {
            path="$1"
            if timeout --signal=TERM --kill-after=1s 5s \
              bash -c 'if test -e "$1"; then stat -c '\''%n type=%F mode=%a owner=%U group=%G'\'' "$1"; else echo "$1 MISSING"; fi' \
              bash "$path"; then
              return 0
            fi
            rc=$?
            if test "$rc" -eq 124 || test "$rc" -eq 137; then
              echo "::error::path-probe-timeout path=${path} timeout=5s"
            else
              echo "::error::path-probe-failed path=${path} status=${rc}"
            fi
            return "$rc"
          }
          for path in /build/agentic-sandbox/base-images /build/agentic-sandbox/vms; do
            bounded_path_probe "$path"
          done
          command -v gitea-runner && gitea-runner --version
          ps -eo pid,user,args | grep '[g]itea-runner' || true
          runner_pid="$(pgrep -f '/usr/local/bin/gitea-runner daemon --config ' | head -n1 || true)"
          if test -n "$runner_pid"; then
            ps -o pid,ppid,user,lstart,args -p "$runner_pid"
            cat "/proc/${runner_pid}/cgroup" || true
          fi
          timeout --signal=TERM --kill-after=1s 5s findmnt -T /build 2>/dev/null || true
          timeout --signal=TERM --kill-after=1s 5s findmnt -T /mnt/ops 2>/dev/null || true
          timeout --signal=TERM --kill-after=1s 5s df -h / /build /mnt/ops 2>/dev/null || true
          if test -r /srv/gitea-runner-host/config.yaml; then
            sed -n '/^[[:space:]]*labels:/,/^[^[:space:]]/p' /srv/gitea-runner-host/config.yaml
          fi
          systemctl --user list-unit-files --type=service 2>/dev/null | grep -Ei 'gitea|runner' || true
          sudo -n systemctl list-unit-files --type=service 2>/dev/null | grep -Ei 'gitea|runner' || true
          systemctl --user --no-pager --full status gitea-runner 2>/dev/null || true
          sudo -n systemctl --no-pager --full status gitea-runner-host 2>/dev/null || true

  configure-build01:
    name: Normalize build01 stable Rust toolchain
    needs: audit-build01
    runs-on: s9-build
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Upgrade build01 to the current Gitea Runner
        run: bash deploy/systemd/install-gitea-runner-build01.sh

      - name: Upgrade stable Rust and required tooling
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy --toolchain stable
          rustup target add \
            x86_64-unknown-linux-gnu \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-gnu \
            --toolchain stable
          rustup check
          rustc --version --verbose
          cargo --version --verbose
          cargo fmt --version
          cargo clippy --version

      - name: Schedule runner restart after job completion
        run: |
          set -euo pipefail
          sudo -n systemctl is-enabled gitea-act-runner-build01.service
          sudo -n systemd-run \
            --unit="gitea-act-runner-build01-restart-${GITHUB_RUN_ID}" \
            --on-active=20s \
            /bin/systemctl restart gitea-act-runner-build01.service
          echo "build01 runner restart scheduled in 20 seconds"

  configure-titan:
    name: Configure Titan shared host runner contract
    if: false
    needs: audit-titan
    runs-on: titan
    timeout-minutes: 20
    steps:
      - name: Upgrade stable Rust and required tooling
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy --toolchain stable
          rustup target add \
            x86_64-unknown-linux-gnu \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-gnu \
            --toolchain stable
          rustup check
          rustc --version --verbose
          cargo --version --verbose
          cargo fmt --version
          cargo clippy --version

      - name: Provision shared VM storage contract
        run: |
          set -euo pipefail
          test -d /mnt/ops/base-images
          test -r /mnt/ops/base-images/ubuntu-server-26.04-agent.qcow2
          sudo -n install -d -m 0775 /build/agentic-sandbox
          if test -e /build/agentic-sandbox/base-images \
            && ! test /build/agentic-sandbox/base-images -ef /mnt/ops/base-images; then
            echo "::error::Existing base-images path does not resolve to /mnt/ops/base-images"
            exit 1
          fi
          if ! test -e /build/agentic-sandbox/base-images; then
            sudo -n ln -s /mnt/ops/base-images /build/agentic-sandbox/base-images
          fi
          sudo -n install -d -m 0775 /build/agentic-sandbox/vms
          if command -v setfacl >/dev/null 2>&1; then
            for account in roctinam deploy libvirt-qemu; do
              if id "$account" >/dev/null 2>&1; then
                sudo -n setfacl -m "u:${account}:rwx,d:u:${account}:rwx" /build/agentic-sandbox/vms
              fi
            done
          fi
          test -r /build/agentic-sandbox/base-images/ubuntu-server-26.04-agent.qcow2
          test -w /build/agentic-sandbox/vms
          stat -c '%n type=%F mode=%a owner=%U group=%G' \
            /build/agentic-sandbox/base-images \
            /build/agentic-sandbox/vms

      - name: Map shared Rust capability to host execution
        run: |
          set -euo pipefail
          config=/srv/gitea-runner-host/config.yaml
          test -r "$config"
          sudo -n cp -a "$config" "${config}.pre-host-rust-${GITHUB_RUN_ID}"
          sudo -n sed -i 's#"rust:docker://rust:latest"#"rust:host"#' "$config"
          grep -F '"rust:host"' "$config"
          if grep -F '"rust:docker://rust:latest"' "$config"; then
            echo "::error::Container-backed rust label remains in $config"
            exit 1
          fi

      - name: Schedule runner restart after job completion
        run: |
          set -euo pipefail
          sudo -n systemctl is-enabled gitea-runner-host.service
          sudo -n systemd-run \
            --unit="gitea-runner-host-restart-${GITHUB_RUN_ID}" \
            --on-active=20s \
            /bin/systemctl restart gitea-runner-host.service
          echo "Titan runner restart scheduled in 20 seconds"

  bootstrap-titan:
    name: Apply Titan shared host runner contract
    needs: audit-titan
    runs-on: titan
    timeout-minutes: 20
    steps:
      - name: Upgrade Titan to the current Gitea Runner
        run: |
          set -euo pipefail
          version="${GITEA_RUNNER_VERSION}"
          expected_sha256="${GITEA_RUNNER_LINUX_AMD64_SHA256}"
          download_url="https://dl.gitea.com/gitea-runner/${version}/gitea-runner-${version}-linux-amd64"
          staging_file="$(mktemp)"
          trap 'rm -f "${staging_file}"' EXIT

          curl --fail --location --silent --show-error \
            --retry 4 --retry-delay 2 \
            --output "${staging_file}" "${download_url}"
          printf '%s  %s\n' "${expected_sha256}" "${staging_file}" | sha256sum --check --status
          chmod 0755 "${staging_file}"
          "${staging_file}" --version

          # Titan's established systemd unit still uses the historical
          # /usr/local/bin/act_runner path. Install the current runner at both
          # names so the scheduled service restart actually activates it while
          # operators and new units can use the canonical gitea-runner name.
          sudo -n install -o root -g root -m 0755 "${staging_file}" /usr/local/bin/gitea-runner
          sudo -n install -o root -g root -m 0755 "${staging_file}" /usr/local/bin/act_runner
          /usr/local/bin/gitea-runner --version
          /usr/local/bin/act_runner --version

      - name: Normalize toolchain, storage, and runner mapping
        run: |
          set -euo pipefail
          maintenance_rc=0
          timeout --signal=TERM --kill-after=30s 15m bash <<'TITAN_MAINTENANCE' || maintenance_rc=$?
          set -euo pipefail

          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy --toolchain stable
          rustup target add \
            x86_64-unknown-linux-gnu \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-gnu \
            --toolchain stable
          rustup check
          rustc --version --verbose
          cargo --version --verbose

          test -d /mnt/ops/base-images
          test -r /mnt/ops/base-images/ubuntu-server-26.04-agent.qcow2
          sudo -n install -d -m 0775 /build/agentic-sandbox
          if test -e /build/agentic-sandbox/base-images \
            && ! test /build/agentic-sandbox/base-images -ef /mnt/ops/base-images; then
            echo "::error::Existing base-images path does not resolve to /mnt/ops/base-images"
            exit 1
          fi
          if ! test -e /build/agentic-sandbox/base-images; then
            sudo -n ln -s /mnt/ops/base-images /build/agentic-sandbox/base-images
          fi
          sudo -n install -d -m 0775 /build/agentic-sandbox/vms
          if command -v setfacl >/dev/null 2>&1; then
            for account in roctinam deploy libvirt-qemu; do
              if id "$account" >/dev/null 2>&1; then
                sudo -n setfacl -m "u:${account}:rwx,d:u:${account}:rwx" /build/agentic-sandbox/vms
              fi
            done
          fi
          test -r /build/agentic-sandbox/base-images/ubuntu-server-26.04-agent.qcow2
          test -w /build/agentic-sandbox/vms

          config=/srv/gitea-runner-host/config.yaml
          test -r "$config"
          if grep -F '"rust:docker://rust:latest"' "$config" >/dev/null; then
            sudo -n cp -a "$config" "${config}.pre-host-rust-${GITHUB_RUN_ID}"
            sudo -n sed -i 's#"rust:docker://rust:latest"#"rust:host"#' "$config"
          fi
          grep -F '"rust:host"' "$config"
          ! grep -F '"rust:docker://rust:latest"' "$config"

          stat -c '%n type=%F mode=%a owner=%U group=%G' \
            /build/agentic-sandbox/base-images \
            /build/agentic-sandbox/vms
          test -r /dev/kvm && test -w /dev/kvm
          virsh --connect qemu:///system uri
          docker version --format 'docker client={{.Client.Version}} server={{.Server.Version}}'

          sudo -n systemctl is-enabled gitea-runner-host.service
          sudo -n systemd-run \
            --unit="gitea-runner-host-restart-${GITHUB_RUN_ID}" \
            --on-active=20s \
            /bin/systemctl restart gitea-runner-host.service
          echo "Titan host contract applied; runner restart scheduled in 20 seconds"
          TITAN_MAINTENANCE
          if test "$maintenance_rc" -eq 124 || test "$maintenance_rc" -eq 137; then
            echo "::error::maintenance-timeout host=titan timeout=15m"
          fi
          exit "$maintenance_rc"
