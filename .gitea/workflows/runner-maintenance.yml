          test -r /dev/kvm && test -w /dev/kvm && echo 'kvm=rw' || echo 'kvm=unavailable'
          for path in /build/agentic-sandbox/base-images /build/agentic-sandbox/vms; do
            if test -e "$path"; then
              stat -c '%n type=%F mode=%a owner=%U group=%G' "$path"
            else
              echo "$path MISSING"
            fi
          done
          ps -eo pid,user,args | grep '[a]ct_runner' || true
          runner_pid="$(pgrep -f '/usr/local/bin/act_runner daemon --config /srv/gitea-runner-host/config.yaml' | head -n1 || true)"
          if test -n "$runner_pid"; then
            ps -o pid,ppid,user,lstart,args -p "$runner_pid"
            cat "/proc/${runner_pid}/cgroup" || true
          fi
          findmnt -T /build 2>/dev/null || true
          findmnt -T /mnt/ops 2>/dev/null || true
          df -h / /build /mnt/ops 2>/dev/null || true
          if test -r /srv/gitea-runner-host/config.yaml; then
            sed -n '/^[[:space:]]*labels:/,/^[^[:space:]]/p' /srv/gitea-runner-host/config.yaml
          fi
          systemctl --user list-unit-files --type=service 2>/dev/null | grep -Ei 'gitea|act.runner' || true
          sudo -n systemctl list-unit-files --type=service 2>/dev/null | grep -Ei 'gitea|act.runner' || true
          systemctl --user --no-pager --full status act_runner 2>/dev/null || true
          sudo -n systemctl --no-pager --full status act_runner 2>/dev/null || true
