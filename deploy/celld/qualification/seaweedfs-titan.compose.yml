name: ${CELLD_SEAWEED_PROJECT:?set CELLD_SEAWEED_PROJECT}

x-seaweed-image: &seaweed-image docker.io/chrislusf/seaweedfs@sha256:3bbe24f6d5f5818327adcfeda7d85240ed53212dab05f91af14484c6446ec5eb
x-seaweed-security: &seaweed-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # The pinned image starts as root and uses su-exec to drop to its dedicated
  # runtime account. Permit only that identity transition; the weed process
  # runs non-root with the remaining capability set dropped.
  cap_add:
    - SETGID
    - SETUID
  restart: "no"
  networks:
    - storage-private

services:
  postgres:
    image: docker.io/library/postgres@sha256:747d5ed1fdeeb124b880fbe3d7c6557d2c4064ae41d6b6297d417882effce4be
    environment:
      POSTGRES_DB: seaweedfs
      POSTGRES_USER: seaweedfs
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ${CELLD_SEAWEED_RUN_ROOT:?set CELLD_SEAWEED_RUN_ROOT}/postgres-password
        target: /run/secrets/postgres-password
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seaweedfs -d seaweedfs"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    restart: "no"
    networks:
      - storage-private

  master1:
    <<: *seaweed-security
    image: *seaweed-image
    command: ["master", "-ip=master1", "-ip.bind=0.0.0.0", "-mdir=/data", "-peers=master1:9333,master2:9333,master3:9333", "-defaultReplication=010", "-volumeSizeLimitMB=256"]
    volumes:
      - master1-data:/data
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9333/cluster/status"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  master2:
    <<: *seaweed-security
    image: *seaweed-image
    command: ["master", "-ip=master2", "-ip.bind=0.0.0.0", "-mdir=/data", "-peers=master1:9333,master2:9333,master3:9333", "-defaultReplication=010", "-volumeSizeLimitMB=256"]
    volumes:
      - master2-data:/data
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9333/cluster/status"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  master3:
    <<: *seaweed-security
    image: *seaweed-image
    command: ["master", "-ip=master3", "-ip.bind=0.0.0.0", "-mdir=/data", "-peers=master1:9333,master2:9333,master3:9333", "-defaultReplication=010", "-volumeSizeLimitMB=256"]
    volumes:
      - master3-data:/data
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9333/cluster/status"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  volume1:
    <<: *seaweed-security
    image: *seaweed-image
    command: ["volume", "-ip=volume1", "-ip.bind=0.0.0.0", "-dir=/data", "-mserver=master1:9333,master2:9333,master3:9333", "-dataCenter=titan", "-rack=rack-1", "-max=16"]
    depends_on:
      master1:
        condition: service_healthy
      master2:
        condition: service_healthy
      master3:
        condition: service_healthy
    volumes:
      - volume1-data:/data
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/status"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  volume2:
    <<: *seaweed-security
    image: *seaweed-image
    command: ["volume", "-ip=volume2", "-ip.bind=0.0.0.0", "-dir=/data", "-mserver=master1:9333,master2:9333,master3:9333", "-dataCenter=titan", "-rack=rack-2", "-max=16"]
    depends_on:
      master1:
        condition: service_healthy
      master2:
        condition: service_healthy
      master3:
        condition: service_healthy
    volumes:
      - volume2-data:/data
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/status"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  volume3:
    <<: *seaweed-security
    image: *seaweed-image
    command: ["volume", "-ip=volume3", "-ip.bind=0.0.0.0", "-dir=/data", "-mserver=master1:9333,master2:9333,master3:9333", "-dataCenter=titan", "-rack=rack-3", "-max=16"]
    depends_on:
      master1:
        condition: service_healthy
      master2:
        condition: service_healthy
      master3:
        condition: service_healthy
    volumes:
      - volume3-data:/data
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/status"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  filer1:
    <<: *seaweed-security
    image: *seaweed-image
    command: ["filer", "-ip=filer1", "-ip.bind=0.0.0.0", "-master=master1:9333,master2:9333,master3:9333", "-defaultReplicaPlacement=010", "-filerGroup=celld-qualification"]
    depends_on:
      postgres:
        condition: service_healthy
      volume1:
        condition: service_healthy
      volume2:
        condition: service_healthy
      volume3:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${CELLD_SEAWEED_RUN_ROOT:?set CELLD_SEAWEED_RUN_ROOT}/filer.toml
        target: /etc/seaweedfs/filer.toml
        read_only: true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8888/status"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  filer2:
    <<: *seaweed-security
    image: *seaweed-image
    command: ["filer", "-ip=filer2", "-ip.bind=0.0.0.0", "-master=master1:9333,master2:9333,master3:9333", "-defaultReplicaPlacement=010", "-filerGroup=celld-qualification"]
    depends_on:
      postgres:
        condition: service_healthy
      volume1:
        condition: service_healthy
      volume2:
        condition: service_healthy
      volume3:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${CELLD_SEAWEED_RUN_ROOT:?set CELLD_SEAWEED_RUN_ROOT}/filer.toml
        target: /etc/seaweedfs/filer.toml
        read_only: true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8888/status"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  filer3:
    <<: *seaweed-security
    image: *seaweed-image
    command: ["filer", "-ip=filer3", "-ip.bind=0.0.0.0", "-master=master1:9333,master2:9333,master3:9333", "-defaultReplicaPlacement=010", "-filerGroup=celld-qualification"]
    depends_on:
      postgres:
        condition: service_healthy
      volume1:
        condition: service_healthy
      volume2:
        condition: service_healthy
      volume3:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${CELLD_SEAWEED_RUN_ROOT:?set CELLD_SEAWEED_RUN_ROOT}/filer.toml
        target: /etc/seaweedfs/filer.toml
        read_only: true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8888/status"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  s3gateway1:
    <<: *seaweed-security
    image: *seaweed-image
    command: ["s3", "-filer=filer1:8888", "-ip.bind=0.0.0.0", "-port=0", "-port.https=8334", "-cert.file=/run/tls/server.crt", "-key.file=/run/tls/server.key", "-cacert.file=/run/tls/ca.crt", "-config=/run/config/s3.json"]
    depends_on:
      filer1:
        condition: service_healthy
      filer2:
        condition: service_healthy
      filer3:
        condition: service_healthy
    ports:
      - "127.0.0.1::8334"
    volumes:
      - type: bind
        source: ${CELLD_SEAWEED_RUN_ROOT:?set CELLD_SEAWEED_RUN_ROOT}/tls
        target: /run/tls
        read_only: true
      - type: bind
        source: ${CELLD_SEAWEED_RUN_ROOT:?set CELLD_SEAWEED_RUN_ROOT}/s3.json
        target: /run/config/s3.json
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

  s3gateway2:
    <<: *seaweed-security
    image: *seaweed-image
    command: ["s3", "-filer=filer2:8888", "-ip.bind=0.0.0.0", "-port=0", "-port.https=8334", "-cert.file=/run/tls/server.crt", "-key.file=/run/tls/server.key", "-cacert.file=/run/tls/ca.crt", "-config=/run/config/s3.json"]
    depends_on:
      filer1:
        condition: service_healthy
      filer2:
        condition: service_healthy
      filer3:
        condition: service_healthy
    ports:
      - "127.0.0.1::8334"
    volumes:
      - type: bind
        source: ${CELLD_SEAWEED_RUN_ROOT:?set CELLD_SEAWEED_RUN_ROOT}/tls
        target: /run/tls
        read_only: true
      - type: bind
        source: ${CELLD_SEAWEED_RUN_ROOT:?set CELLD_SEAWEED_RUN_ROOT}/s3.json
        target: /run/config/s3.json
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

networks:
  storage-private:
    internal: true
    labels:
      dev.agentic-sandbox.scope: celld-qualification

volumes:
  postgres-data: {}
  master1-data: {}
  master2-data: {}
  master3-data: {}
  volume1-data: {}
  volume2-data: {}
  volume3-data: {}
