apiVersion: loadout/v1
kind: loadout
metadata:
  name: browser-qa
  description: Trusted-input browser automation QA (carbonyl + uinput + Xorg)
  labels:
    category: task-focused
    complexity: standard

# VM-isolation fallback for trusted-input browser QA. Docker isolation via
# carbonyl-agent/docker/qa-runner is the preferred runtime; this profile
# exists for the case where Docker hot-plug for runtime-created uinput
# devices is unavailable (see roctinam/carbonyl-agent#120).

extends:
  # Browser acceptance needs the OS/Python test substrate, not the full
  # language-toolchain bootstrap (fnm, Go, Rust, Bun). Keeping this profile
  # task-focused avoids unrelated external downloads blocking Xorg readiness.
  - layers/base-minimal.yaml
  - layers/browser-automation.yaml

resources:
  cpus: 4
  memory: 8G
  disk: 40G

# Browser automation installs Xorg, uinput, Python bindings, and carbonyl.
# Keep --wait-ready tolerant of loaded hosts without making every loadout wait
# this long by default.
readiness:
  setup_timeout_seconds: 1200

network:
  mode: full
